name: Safe CSS Extraction

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-css:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project-context
        uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract the existing inline styles
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          css = Path('assets/styles.css')
          text = index.read_text(encoding='utf-8')

          pattern = re.compile(r'<style>(.*?)</style>', re.DOTALL | re.IGNORECASE)
          matches = list(pattern.finditer(text))
          if not matches:
              raise SystemExit('No complete plain <style>...</style> blocks found; nothing changed.')

          stylesheet_parts = []
          for i, match in enumerate(matches, 1):
              part = match.group(1)
              if not part.strip():
                  raise SystemExit(f'Style block {i} is empty; refusing automatic extraction.')
              stylesheet_parts.append(f'/* Original inline style block {i} */\n{part.strip()}\n')

          css.parent.mkdir(parents=True, exist_ok=True)
          css.write_text('\n\n'.join(stylesheet_parts) + '\n', encoding='utf-8')

          replacement = '<link rel="stylesheet" href="assets/styles.css">'
          updated = pattern.sub(replacement, text)
          index.write_text(updated, encoding='utf-8')

          print(f'Inline style blocks extracted: {len(matches)}')
          print(f'Extracted CSS bytes: {len(css.read_bytes())}')

      - name: Validate the extracted stylesheet
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/styles.css').read_text(encoding='utf-8')

          if '<link rel="stylesheet" href="assets/styles.css">' not in html:
              raise SystemExit('Stylesheet link missing from index.html')
          if not css.strip():
              raise SystemExit('Extracted CSS is empty')
          if re.search(r'<style(?:\s|>)', html, re.IGNORECASE):
              raise SystemExit('Inline <style> block still present after extraction')
          if re.search(r'</style>', html, re.IGNORECASE):
              raise SystemExit('Closing </style> tag still present after extraction')

          print(f'Updated HTML bytes: {len(html.encode("utf-8"))}')
          print('CSS extraction validation passed.')

      - name: Commit extracted stylesheet
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/styles.css; then
            echo 'No CSS extraction changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/styles.css
          git commit -m 'refactor: extract inline CSS [refactor-bot]'
          git push origin HEAD:project-context
