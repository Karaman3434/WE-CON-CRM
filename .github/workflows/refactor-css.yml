name: Safe CSS Extraction

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-css:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project-context
        uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract the existing inline stylesheet
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          css = Path('assets/styles.css')
          text = index.read_text(encoding='utf-8')

          start = text.find('<style>')
          end = text.find('</style>', start + 7)
          if start < 0 or end < 0:
              raise SystemExit('No complete <style>...</style> block found; nothing changed.')

          second = text.find('<style>', end + 8)
          if second >= 0:
              raise SystemExit('More than one <style> block detected; refusing automatic extraction.')

          stylesheet = text[start + len('<style>'):end]
          if not stylesheet.strip():
              raise SystemExit('Stylesheet is empty; refusing automatic extraction.')

          css.parent.mkdir(parents=True, exist_ok=True)
          css.write_text(stylesheet.lstrip('\n'), encoding='utf-8')

          replacement = '<link rel="stylesheet" href="assets/styles.css">'
          updated = text[:start] + replacement + text[end + len('</style>'):]
          index.write_text(updated, encoding='utf-8')

      - name: Validate the extracted stylesheet
        shell: python
        run: |
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/styles.css').read_text(encoding='utf-8')

          if '<link rel="stylesheet" href="assets/styles.css">' not in html:
              raise SystemExit('Stylesheet link missing from index.html')
          if not css.strip():
              raise SystemExit('Extracted CSS is empty')
          if '<style>' in html or '</style>' in html:
              raise SystemExit('Inline style block still present after extraction')

          print(f'Extracted CSS bytes: {len(css.encode("utf-8"))}')
          print(f'Updated HTML bytes: {len(html.encode("utf-8"))}')

      - name: Commit extracted stylesheet
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/styles.css; then
            echo 'No CSS extraction changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/styles.css
          git commit -m 'refactor: extract inline CSS [refactor-bot]'
          git push origin HEAD:project-context
