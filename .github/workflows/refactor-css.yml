name: Safe CSS Extraction

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-css:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project-context
        uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract and normalize CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          css = Path('assets/styles.css')
          text = index.read_text(encoding='utf-8')

          pattern = re.compile(r'<style>(.*?)</style>', re.DOTALL | re.IGNORECASE)
          matches = list(pattern.finditer(text))

          if matches:
              parts = []
              for i, match in enumerate(matches, 1):
                  part = match.group(1)
                  if not part.strip():
                      raise SystemExit(f'Style block {i} is empty; refusing automatic extraction.')
                  parts.append(f'/* Original inline style block {i} */\n{part.strip()}\n')
              css.parent.mkdir(parents=True, exist_ok=True)
              css.write_text('\n\n'.join(parts) + '\n', encoding='utf-8')
              text = pattern.sub('', text)
              print(f'Inline style blocks extracted: {len(matches)}')
          else:
              print('No inline style blocks remain; validating existing external stylesheet.')

          link = '<link rel="stylesheet" href="assets/styles.css">'
          text = re.sub(r'\s*<link rel="stylesheet" href="assets/styles\.css">', '', text)
          insertion = '\n' + link + '\n'
          head = text.lower().find('</head>')
          if head < 0:
              raise SystemExit('Missing </head>; refusing normalization.')
          text = text[:head] + insertion + text[head:]

          if not css.exists() or not css.read_text(encoding='utf-8').strip():
              raise SystemExit('External stylesheet is missing or empty.')

          index.write_text(text, encoding='utf-8')

      - name: Validate CSS extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/styles.css').read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="assets/styles.css">'

          if html.count(link) != 1:
              raise SystemExit(f'Expected exactly one external stylesheet link, found {html.count(link)}')
          if re.search(r'<style(?:\s|>)', html, re.IGNORECASE):
              raise SystemExit('Inline <style> block still present.')
          if re.search(r'</style>', html, re.IGNORECASE):
              raise SystemExit('Closing </style> tag still present.')
          if not css.strip():
              raise SystemExit('External CSS is empty.')

          print(f'HTML bytes: {len(html.encode("utf-8"))}')
          print(f'CSS bytes: {len(css.encode("utf-8"))}')
          print('CSS extraction validation passed.')

      - name: Commit result
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/styles.css; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/styles.css
          git commit -m 'refactor: normalize external CSS [refactor-bot]'
          git push origin HEAD:project-context
