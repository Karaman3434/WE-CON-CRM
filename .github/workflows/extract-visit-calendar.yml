name: Extract Visit Calendar

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-visit-calendar:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract visit calendar block
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          module_path = Path('assets/visit-calendar.js')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="assets/visit-calendar.js"></script>'
          start_marker = '// ============ ZİYARET TAKVİMİ ============'
          end_marker = '// ============ ZİYARET FOTOĞRAF / İLETİŞİM ============'

          if tag in html:
              print('Visit calendar already externalized.')
          else:
              start = html.find(start_marker)
              end = html.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit('Visit calendar boundaries were not found; refusing to modify index.html.')

              block = html[start:end]
              required = [
                  'function ziyaretTakvimiAc',
                  'function ziyaretTakvimiCiz',
              ]
              for needle in required:
                  if needle not in block:
                      raise SystemExit(f'Required visit-calendar symbol missing: {needle}')

              module_path.write_text(block + '\n', encoding='utf-8')
              html = html[:start] + tag + '\n\n' + html[end:]
              path.write_text(html, encoding='utf-8')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          module = Path('assets/visit-calendar.js').read_text(encoding='utf-8')

          if html.count('<script src="assets/visit-calendar.js"></script>') != 1:
              raise SystemExit('Expected exactly one visit-calendar.js script tag.')
          if '// ============ ZİYARET TAKVİMİ ============' in html:
              raise SystemExit('Inline visit calendar block remains in index.html.')
          if '// ============ ZİYARET FOTOĞRAF / İLETİŞİM ============' not in html:
              raise SystemExit('Visit photo/contact boundary was damaged.')

          for name in ['ziyaretTakvimiAc','ziyaretTakvimiCiz']:
              if not re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', module):
                  raise SystemExit(f'Visit calendar function missing from extracted module: {name}')

          print('Visit calendar extraction validated.')

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/visit-calendar.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract visit calendar [refactor-bot]'
          git push origin HEAD:project-context
