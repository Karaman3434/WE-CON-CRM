name: Validate Customer Core

on:
  push:
    branches:
      - project-context

permissions:
  contents: read

jobs:
  validate-customer-core:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 1

      - name: Validate customer data safety boundaries
        shell: python
        run: |
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          module = Path('assets/customer-id-core.js').read_text(encoding='utf-8')

          # Customer ID helpers are intentionally externalized.
          for needle in [
              'function musteriSonrakiKoduBul',
              'function musteriIdUret',
              'function musteriIdEksikleriTamamla',
          ]:
              if needle not in module:
                  raise SystemExit(f'Missing customer ID module symbol: {needle}')

          # Remaining customer operations stay in the main application.
          for needle in [
              'function musteriKaydetGercek',
              'function musteriBirlestirOnayla',
              'function musteriPanelAc',
          ]:
              if needle not in html:
                  raise SystemExit(f'Missing customer-core application symbol: {needle}')

          for needle in ['weicon_musteriler', 'fbGet("musteriler")', 'fbSet("musteriler"']:
              if needle not in html:
                  raise SystemExit(f'Customer persistence guard missing: {needle}')

          for src in ['assets/customer-id-core.js', 'assets/card-photo-ai.js', 'assets/product-entry.js']:
              if html.count(f'<script src="{src}"></script>') != 1:
                  raise SystemExit(f'Expected exactly one script tag for {src}.')

          print('Customer core safety boundaries validated.')

      - name: Validate customer module syntax markers
        shell: python
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          if html.count('<script>') != html.count('</script>'):
              raise SystemExit('Unbalanced inline script tags detected.')
          print('Script tag balance validated.')
          PY

# Validation is isolated to project-context.
