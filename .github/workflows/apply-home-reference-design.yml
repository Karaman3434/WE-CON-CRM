name: Apply approved home reference design

on:
  push:
    paths:
      - '.github/workflows/apply-home-reference-design.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved Ana Sayfa design
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'\s*<script id="weicon-home-reference-1">.*?</script>\s*', '\n', html, flags=re.S)
          script = r'''<script id="weicon-home-reference-1">
          (function(){
            function setp(el, prop, value){ if(el) el.style.setProperty(prop, value, 'important'); }
            function addp(el, cls){ if(el && !el.classList.contains(cls)) el.classList.add(cls); }
            function text(el){ return (el && (el.innerText || el.textContent) || '').replace(/\s+/g,' ').trim(); }
            function closestCard(el){
              var n=el;
              for(var i=0;i<7 && n;i++,n=n.parentElement){
                var s=n.getAttribute && n.getAttribute('style') || '';
                if(n.tagName==='DIV' && /border-radius/i.test(s) && (/padding/i.test(s) || /display\s*:\s*flex/i.test(s) || /grid/i.test(s))) return n;
              }
              return el && el.parentElement;
            }
            function findByText(root, needle){
              var all=root.querySelectorAll('*'), out=[];
              for(var i=0;i<all.length;i++) if(text(all[i])===needle) out.push(all[i]);
              return out;
            }
            function markCards(){
              var page=document.getElementById('page8'); if(!page) return;
              var groups=[
                {keys:['BU AY · AĞUSTOS','SATIŞIM'], cls:'ref-metric ref-blue'},
                {keys:['BU AY · AĞUSTOS','PRİMİM'], cls:'ref-metric ref-green'},
                {keys:['BUGÜNÜN','SATIŞI'], cls:'ref-metric ref-orange'},
                {keys:['BUGÜNÜN','PRİMİ'], cls:'ref-metric ref-purple'},
                {keys:['Ürün Bul'], cls:'ref-shortcut ref-blue'},
                {keys:['Hızlı Hesapla'], cls:'ref-shortcut ref-green'},
                {keys:['Satış'], cls:'ref-shortcut ref-red'},
                {keys:['Araç KM'], cls:'ref-shortcut ref-blue'}
              ];
              groups.forEach(function(g){
                var candidates=[];
                g.keys.forEach(function(k){ findByText(page,k).forEach(function(x){ var c=closestCard(x); if(c && candidates.indexOf(c)<0) candidates.push(c); }); });
                if(candidates.length){ var card=candidates[0]; addp(card,g.cls.split(' ')[0]); addp(card,g.cls.split(' ')[1]); }
              });
              var banner=document.getElementById('bildirimBanner'); if(banner) banner.classList.add('ref-alert');
            }
            function applyTheme(){
              var page=document.getElementById('page8'); if(!page) return;
              var active=page.classList.contains('active') || getComputedStyle(page).display!=='none';
              document.body.classList.toggle('weicon-home-ref1', active);
              if(!active) return;
              markCards();
              setp(page,'background','#f4f6fa'); setp(page,'color','#111827'); setp(page,'padding-bottom','28px'); setp(page,'box-sizing','border-box');
              var date=document.getElementById('gunTarihi'); setp(date,'color','#101828'); setp(date,'font-weight','900');
              var grid=document.getElementById('ustNavGrid'); if(grid){ setp(grid,'background','#f4f6fa'); setp(grid,'padding','4px 12px 12px'); }
              var nav=document.getElementById('navTabsContainer'); if(nav) setp(nav,'background','transparent');
              var homeBtn=document.getElementById('tabBtn8'); if(homeBtn){ setp(homeBtn,'color','#1264e8'); setp(homeBtn,'background','transparent'); }
              var back=document.querySelector('#ustNavGrid button[onclick="geriGit()"]'); if(back) setp(back,'color','#ff7a00');
              var menu=document.querySelector('#ustNavGrid button[onclick="ustMenuAcKapat()"]'); if(menu) setp(menu,'color','#111827');
              page.querySelectorAll('.ref-metric,.ref-shortcut').forEach(function(c){ setp(c,'background','#ffffff'); setp(c,'border-radius','20px'); setp(c,'box-shadow','0 8px 24px rgba(15,23,42,.10)'); setp(c,'overflow','hidden'); setp(c,'box-sizing','border-box'); });
              page.querySelectorAll('.ref-metric').forEach(function(c){ setp(c,'padding','26px 22px'); setp(c,'min-height','178px'); setp(c,'margin-bottom','0'); var t=text(c); if(t.indexOf('SATIŞIM')>=0) setp(c,'border','2px solid #2f6df6'); else if(t.indexOf('PRİMİM')>=0) setp(c,'border','2px solid #19b96b'); else if(t.indexOf('BUGÜNÜN')>=0 && t.indexOf('PRİMİ')<0) setp(c,'border','2px solid #ff8a00'); else setp(c,'border','2px solid #7b43e8'); });
              page.querySelectorAll('.ref-shortcut').forEach(function(c){ setp(c,'padding','20px 18px'); setp(c,'min-height','92px'); setp(c,'margin-bottom','0'); });
              page.querySelectorAll('.ref-shortcut > div:nth-child(3) > div:first-child').forEach(function(e){ setp(e,'color','#111827'); setp(e,'font-size','24px'); setp(e,'font-weight','900'); });
              page.querySelectorAll('.ref-shortcut > div:nth-child(3) > div:nth-child(2)').forEach(function(e){ setp(e,'color','#667085'); setp(e,'font-size','17px'); setp(e,'font-weight','700'); });
              page.querySelectorAll('.ref-metric').forEach(function(c){ var t=text(c); c.querySelectorAll('div,span').forEach(function(e){ var tx=text(e); if(['BU AY · AĞUSTOS','SATIŞIM','PRİMİM','BUGÜNÜN','SATIŞI','PRİMİ'].indexOf(tx)>=0){ if(t.indexOf('SATIŞIM')>=0) setp(e,'color','#1664e8'); else if(t.indexOf('PRİMİM')>=0) setp(e,'color','#16a34a'); else if(t.indexOf('BUGÜNÜN')>=0 && t.indexOf('PRİMİ')<0) setp(e,'color','#f57c00'); else if(t.indexOf('BUGÜNÜN')>=0) setp(e,'color','#7138d6'); } }); });
              var alert=document.getElementById('bildirimBanner'); if(alert){ setp(alert,'background','#ffffff'); setp(alert,'color','#111827'); setp(alert,'border','1px solid #d9dee8'); setp(alert,'border-radius','18px'); setp(alert,'box-shadow','0 8px 22px rgba(15,23,42,.10)'); setp(alert,'padding','18px 20px'); }
            }
            function boot(){ applyTheme(); }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
            window.addEventListener('resize',applyTheme);
            var p=document.getElementById('page8'); if(p) new MutationObserver(function(){ applyTheme(); }).observe(p,{attributes:true,attributeFilter:['class','style']});
          })();
          </script>'''
          html = html.replace('</body>', script + '\n</body>', 1)
          p.write_text(html, encoding='utf-8')
      - name: Commit design and remove temporary workflow
        shell: bash
        run: |
          git config user.name "WEICON CRM Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-home-reference-design.yml
          git diff --cached --quiet && exit 0
          git commit -m "Ana Sayfa: onaylanan 1. görsel tasarımını uygula [skip ci]"
          git push
