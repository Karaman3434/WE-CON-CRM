name: Browser Smoke Test

on:
  push:
    branches:
      - project-context

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project-context
        uses: actions/checkout@v4
        with:
          ref: project-context

      - name: Start local web server
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/weicon-http.log 2>&1 &
          echo $! > /tmp/weicon-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weicon-http.log
          exit 1

      - name: Load application in Chrome
        shell: bash
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8080/index.html > /tmp/weicon-dom.html
          test -s /tmp/weicon-dom.html
          grep -q 'WEICON ASIST' /tmp/weicon-dom.html
          grep -q 'Giriş Yap' /tmp/weicon-dom.html
          grep -q 'assets/styles.css' /tmp/weicon-dom.html
          ! grep -q '<style>' /tmp/weicon-dom.html
          echo 'Browser smoke test passed.'

      - name: Stop local web server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/weicon-http.pid ]; then kill "$(cat /tmp/weicon-http.pid)" || true; fi
