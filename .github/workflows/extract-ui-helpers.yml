name: Extract UI Helpers

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-ui-helpers:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract the two verified UI helper blocks in place
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          module = Path('assets/ui-helpers.js')
          text = index.read_text(encoding='utf-8')
          pattern = re.compile(r'<script>(.*?)</script>', re.DOTALL | re.IGNORECASE)
          blocks = list(pattern.finditer(text))
          markers = ['function updateHTML(el,html){', 'function ustPanelYuksekligiOlc()']
          selected = []
          for marker in markers:
              matches = [m for m in blocks if marker in m.group(1)]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one block containing {marker!r}, found {len(matches)}')
              selected.append(matches[0])

          selected.sort(key=lambda m: m.start())
          parts = [f'// Extracted from original index.html UI helper block {i}\n{m.group(1).strip()}' for i,m in enumerate(selected,1)]
          module.parent.mkdir(parents=True, exist_ok=True)
          module.write_text('\n\n'.join(parts) + '\n', encoding='utf-8')

          link = '<script src="assets/ui-helpers.js"></script>'
          updated = text
          for m in reversed(selected):
              updated = updated[:m.start()] + link + updated[m.end():]
          index.write_text(updated, encoding='utf-8')

          print(f'Extracted UI helper blocks: {len(selected)}')
          print(f'UI helper module bytes: {len(module.read_bytes())}')

      - name: Validate UI helper extraction
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/ui-helpers.js').read_text(encoding='utf-8')
          link = '<script src="assets/ui-helpers.js"></script>'
          if html.count(link) != 2:
              raise SystemExit(f'Expected two in-place UI helper links, found {html.count(link)}')
          for marker in ['function updateHTML(el,html){', 'function ustPanelYuksekligiOlc()']:
              if marker in html:
                  raise SystemExit(f'UI helper marker still present in index.html: {marker}')
              if marker not in js:
                  raise SystemExit(f'UI helper marker missing from module: {marker}')
          print('UI helper extraction validation passed.')

      - name: Commit extracted module
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/ui-helpers.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract UI helper module [refactor-bot]'
          git push origin HEAD:project-context
