name: Remove bad home theme

on:
  push:
    paths:
      - '.github/workflows/apply-home-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove injected theme
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html2 = re.sub(r'\s*<style id="weicon-home-gradient-glow-2026">.*?</script>\s*', '\n', html, count=1, flags=re.S)
          if html2 != html:
              p.write_text(html2, encoding='utf-8')
      - name: Restore clean state
        shell: bash
        run: |
          git config user.name "WEICON CRM Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-home-theme.yml
          git diff --cached --quiet && exit 0
          git commit -m "Ana ekran tasarımını geri al [skip ci]"
          git push
