name: WE-CON CRM HATA-004

on:
  push:
    branches: [fix-004-reports-safety]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor == 'Karaman3434'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-004-reports-safety
          fetch-depth: 0

      - name: Apply transactional Firebase fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('reports-data.js')
          s = path.read_text(encoding='utf-8')

          def replace_function(src, name, replacement):
              marker = 'function ' + name + '('
              start = src.find(marker)
              if start < 0:
                  raise SystemExit(f'{name} bulunamadı')
              brace = src.find('{', start)
              if brace < 0:
                  raise SystemExit(f'{name} açılış parantezi bulunamadı')
              depth = 0
              i = brace
              in_str = None
              esc = False
              in_line = False
              in_block = False
              while i < len(src):
                  c = src[i]
                  n = src[i+1] if i + 1 < len(src) else ''
                  if in_line:
                      if c == '\n': in_line = False
                  elif in_block:
                      if c == '*' and n == '/': in_block = False; i += 1
                  elif in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == in_str: in_str = None
                  else:
                      if c == '/' and n == '/': in_line = True; i += 1
                      elif c == '/' and n == '*': in_block = True; i += 1
                      elif c in ('"', "'", '`'): in_str = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return src[:start] + replacement + src[i+1:]
                  i += 1
              raise SystemExit(f'{name} kapanışı bulunamadı')

          helper = r'''function guvenliArsivYaz(tip, mutateFn, geriBildirim){
    try{
      var ref = firebase.database().ref("arsiv/" + tip);
      return ref.transaction(function(currentData){
        var liste = currentData ? (Array.isArray(currentData) ? currentData.filter(Boolean) : Object.values(currentData)) : [];
        var sonuc = mutateFn(liste);
        if(sonuc === false) return;
        return liste;
      }).then(function(result){
        if(!result.committed){
          if(geriBildirim) geriBildirim(false, "İşlem tamamlanmadı");
          return false;
        }
        if(geriBildirim) geriBildirim(true);
        return true;
      }).catch(function(err){
        console.error("Arşiv transaction hatası:", err);
        if(geriBildirim) geriBildirim(false, err);
        return false;
      });
    }catch(e){
      console.error("Arşiv transaction başlatma hatası:", e);
      if(geriBildirim) geriBildirim(false, e);
      return Promise.resolve(false);
    }
  }'''

          s = replace_function(s, 'guvenliGorevYaz', r'''function guvenliGorevYaz(mutateFn){
    try{
      var ref = firebase.database().ref("gorevler");
      return ref.transaction(function(currentData){
        var tazeGorevler = currentData ? (Array.isArray(currentData) ? currentData.filter(Boolean) : Object.values(currentData)) : [];
        var sonuc = mutateFn(tazeGorevler);
        if(sonuc === false) return;
        return tazeGorevler;
      }).then(function(result){
        if(!result.committed) console.warn("Görev transaction commit edilmedi.");
        return result.committed;
      }).catch(function(err){
        console.error("Görev transaction hatası:", err);
        return false;
      });
    }catch(e){
      console.error("Görev transaction başlatma hatası:", e);
      return Promise.resolve(false);
    }
  }''')

          s = s.replace('guvenliGorevYaz(function(tazeGorevler){ tazeGorevler.push(yeni); });', 'guvenliGorevYaz(function(tazeGorevler){ tazeGorevler.push(yeni); return true; });')
          s = s.replace('guvenliGorevYaz(function(tazeGorevler){\n      var g = tazeGorevler.find(function(x){ return x.id===id; });\n      if(!g) return;\n      g.tamamlandi = !g.tamamlandi;', 'guvenliGorevYaz(function(tazeGorevler){\n      var g = tazeGorevler.find(function(x){ return x.id===id; });\n      if(!g) return false;\n      g.tamamlandi = !g.tamamlandi;')

          s = replace_function(s, 'kaydiKacanIsaretle', r'''function kaydiKacanIsaretle(tip, ts, sebep, rakip, geriBildirim){
    return guvenliArsivYaz(tip, function(liste){
      var idx = liste.findIndex(function(k){ return k.ts === ts; });
      if(idx === -1){
        if(geriBildirim) geriBildirim(false, "Kayıt bulunamadı");
        return false;
      }
      liste[idx].durum = "kacan";
      liste[idx].kacanSebep = sebep || "";
      liste[idx].kacanRakip = rakip || "";
      return true;
    }, geriBildirim);
  }''')

          s = replace_function(s, 'kaydiSil', r'''function kaydiSil(tip, ts, geriBildirim){
    return guvenliArsivYaz(tip, function(liste){
      var yeniListe = liste.filter(function(k){ return k.ts !== ts; });
      if(yeniListe.length === liste.length){
        if(geriBildirim) geriBildirim(false, "Kayıt bulunamadı");
        return false;
      }
      liste.splice(0, liste.length);
      Array.prototype.push.apply(liste, yeniListe);
      return true;
    }, geriBildirim);
  }''')

          s = replace_function(s, 'kayitlariBirlestir', r'''function kayitlariBirlestir(digerAd, digerId, anaAd, anaId, geriBildirim){
    var tipler = ["siparis","teklif","proforma","numune"];
    var i = 0;
    function sonrakiTipiGec(){
      if(i >= tipler.length){
        return firebase.database().ref("gorevler").transaction(function(currentData){
          var liste = currentData ? (Array.isArray(currentData) ? currentData.filter(Boolean) : Object.values(currentData)) : [];
          var degisti = false;
          liste.forEach(function(g){
            if(g.musteriId === digerId || g.musteriAd === digerAd){
              g.musteriId = anaId;
              g.musteriAd = anaAd;
              degisti = true;
            }
          });
          return degisti ? liste :;
        }).then(function(){
          if(geriBildirim) geriBildirim(true);
        }).catch(function(err){
          if(geriBildirim) geriBildirim(false, err);
        });
      }
      var tip = tipler[i++];
      return guvenliArsivYaz(tip, function(liste){
        var degisti = false;
        liste.forEach(function(k){
          var eslesme = (digerId && k.musteriId) ? (k.musteriId === digerId) : (k.musteri === digerAd);
          if(eslesme){
            k.musteri = anaAd;
            k.musteriId = anaId;
            degisti = true;
          }
        });
        return degisti ? true : false;
      }).then(sonrakiTipiGec);
    }
    return sonrakiTipiGec();
  }''')

          # Correct the intentional JS ternary-abort expression in task transaction.
          s = s.replace('return degisti ? liste :;','if(!degisti) return; return liste;')

          s = replace_function(s, 'kaydiGuncelle', r'''function kaydiGuncelle(tip, ts, yeniUrunler, geriBildirim){
    return guvenliArsivYaz(tip, function(liste){
      var idx = liste.findIndex(function(k){ return k.ts === ts; });
      if(idx === -1){
        if(geriBildirim) geriBildirim(false, "Kayıt bulunamadı");
        return false;
      }
      liste[idx].urunler = yeniUrunler;
      liste[idx].revizeZamani = Date.now();
      return true;
    }, geriBildirim);
  }''')

          path.write_text(s, encoding='utf-8')
          print('HATA-004 dönüşümleri uygulandı')
      - name: Syntax check
        run: node --check reports-data.js
      - name: Commit fix
        run: |
          git config user.name "WE-CON-CRM Safety Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports-data.js
          git diff --cached --quiet && echo "Değişiklik yok" && exit 0
          git commit -m "fix: make reports data writes transactional"
          git push origin HEAD:fix-004-reports-safety
