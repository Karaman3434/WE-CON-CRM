name: Extract Deep AI Analysis

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-deep-ai-analysis:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract only the deep AI function
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          module_path = Path('assets/deep-ai-analysis.js')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="assets/deep-ai-analysis.js"></script>'

          if tag in html:
              print('Deep AI analysis already externalized.')
              raise SystemExit(0)

          marker = 'function anomaliDerinAnalizIste()'
          start = html.find(marker)
          if start < 0:
              raise SystemExit('Deep AI analysis function not found; refusing modification.')

          brace = html.find('{', start)
          if brace < 0:
              raise SystemExit('Deep AI analysis opening brace not found; refusing modification.')

          depth = 0
          quote = None
          escape = False
          line_comment = False
          block_comment = False
          i = brace
          end = None
          while i < len(html):
              ch = html[i]
              nxt = html[i + 1] if i + 1 < len(html) else ''
              if line_comment:
                  if ch == '\n': line_comment = False
                  i += 1; continue
              if block_comment:
                  if ch == '*' and nxt == '/':
                      block_comment = False; i += 2; continue
                  i += 1; continue
              if quote:
                  if escape: escape = False
                  elif ch == '\\': escape = True
                  elif ch == quote: quote = None
                  i += 1; continue
              if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
              if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
              if ch in ('"', "'", '`'): quote = ch; i += 1; continue
              if ch == '{': depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
              i += 1

          if end is None:
              raise SystemExit('Deep AI analysis function boundary is unsafe; refusing modification.')

          block = html[start:end]
          if any(token in block for token in ['localStorage.', 'sessionStorage.', 'fbGet(', 'fbSet(', 'fbUpdate(']):
              raise SystemExit('Persistence access found in deep AI analysis function; refusing extraction.')

          module_path.write_text(block.rstrip() + '\n', encoding='utf-8')
          html = html[:start] + tag + html[end:]
          path.write_text(html, encoding='utf-8')
          print('Extracted anomaliDerinAnalizIste')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          module = Path('assets/deep-ai-analysis.js').read_text(encoding='utf-8')

          if html.count('<script src="assets/deep-ai-analysis.js"></script>') != 1:
              raise SystemExit('Expected exactly one deep AI analysis script tag.')
          if not re.search(r'\bfunction\s+anomaliDerinAnalizIste\s*\(', module):
              raise SystemExit('Deep AI analysis function missing from module.')
          if any(token in module for token in ['localStorage.', 'sessionStorage.', 'fbGet(', 'fbSet(', 'fbUpdate(']):
              raise SystemExit('Persistence call found in deep AI analysis module.')
          print('Deep AI analysis extraction validated.')

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/deep-ai-analysis.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract deep AI analysis [refactor-bot]'
          git push origin HEAD:project-context
