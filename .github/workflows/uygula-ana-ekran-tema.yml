name: Onaylanan Ana Ekran Temasini Uygula

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: CSS baglantisini ekle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="css/home-theme-2026.css">'
          if marker not in s:
              needle = '</head>'
              if needle not in s:
                  raise SystemExit('HEAD bulunamadi')
              s = s.replace(needle, marker + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Degisikligi kaydet ve tek seferlik kurulumu temizle
        run: |
          git config user.name "WEICON CRM Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/uygula-ana-ekran-tema.yml
          git commit -m "Onaylanan ana ekran temasini uygula"
          git push
