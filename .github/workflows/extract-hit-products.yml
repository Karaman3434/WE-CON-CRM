name: Extract Hit Products

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-hit-products:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract hit products module in place
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          module = Path('assets/hit-products.js')
          html = index.read_text(encoding='utf-8')
          scripts = list(re.finditer(r'<script>(.*?)</script>', html, re.DOTALL | re.IGNORECASE))
          if not scripts:
              raise SystemExit('No inline script found.')
          target = max(scripts, key=lambda m: len(m.group(1)))
          lines = target.group(1).splitlines()

          start_marker = 'function hitUrunleriHesapla'
          end_marker = 'function enCokAranakHesapla'
          starts = [i for i, line in enumerate(lines) if start_marker in line]
          ends = [i for i, line in enumerate(lines) if end_marker in line]
          if len(starts) != 1 or len(ends) != 1 or not starts[0] < ends[0]:
              raise SystemExit(f'Could not identify hit-product boundaries: starts={starts}, ends={ends}')

          start, end = starts[0], ends[0]
          section = lines[start:end]
          if len(section) < 30:
              raise SystemExit('Hit-products section unexpectedly short; refusing extraction.')

          module.parent.mkdir(parents=True, exist_ok=True)
          module.write_text('\n'.join(section).rstrip() + '\n', encoding='utf-8')

          marker = '/* HIT PRODUCTS EXTRACTED TO assets/hit-products.js */'
          new_lines = lines[:start] + [marker] + lines[end:]
          new_script = '<script>\n' + '\n'.join(new_lines) + '\n</script>'
          html = html[:target.start()] + new_script + html[target.end():]
          html = html.replace(marker, '<script src="assets/hit-products.js"></script>', 1)
          index.write_text(html, encoding='utf-8')
          print(f'Extracted hit-products lines: {len(section)}')
          print(f'Hit-products bytes: {len(module.read_bytes())}')

      - name: Validate hit products extraction
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/hit-products.js').read_text(encoding='utf-8')
          link = '<script src="assets/hit-products.js"></script>'
          if html.count(link) != 1:
              raise SystemExit(f'Expected one hit-products link, found {html.count(link)}')
          if 'function hitUrunleriHesapla' in html:
              raise SystemExit('Hit-products functions remain inline.')
          if 'function enCokAranakHesapla' not in html:
              raise SystemExit('Boundary function disappeared from index.html.')
          required = ['hitUrunleriHesapla', 'hitUrundenSepeteEkle', 'hitUrunlerAc']
          for name in required:
              if name not in js:
                  raise SystemExit(f'Missing expected function/name: {name}')
          if not js.strip():
              raise SystemExit('Hit-products module is empty.')
          print('Hit-products extraction validation passed.')

      - name: Commit extracted module
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/hit-products.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract hit products module [refactor-bot]'
          git push origin HEAD:project-context
