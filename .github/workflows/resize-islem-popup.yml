name: Resize Islem Popup
on:
  push:
    paths:
      - '.github/workflows/resize-islem-popup.yml'
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resize only the Islem popup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "setp(panel,'max-width','520px');setp(panel,'width','calc(100vw - 32px)');"
          new = "setp(panel,'max-width','calc(100vw - 32px)');setp(panel,'width','calc(100vw - 32px)');"
          if old not in s:
              raise SystemExit('Target Islem popup rule not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'İşlemler popup genişliğini diğer popup ölçüsüne getir' || exit 0
          git push
