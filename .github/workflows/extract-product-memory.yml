name: Extract Product Memory

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-product-memory:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract product memory module in place
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          module = Path('assets/product-memory.js')
          html = index.read_text(encoding='utf-8')
          scripts = list(re.finditer(r'<script>(.*?)</script>', html, re.DOTALL | re.IGNORECASE))
          target = max(scripts, key=lambda m: len(m.group(1)))
          lines = target.group(1).splitlines()

          start_marker = 'SON KULLANILAN ÜRÜNLER'
          end_marker = 'function topluIskontoUygula'
          starts = [i for i, line in enumerate(lines) if start_marker in line]
          ends = [i for i, line in enumerate(lines) if end_marker in line]
          if len(starts) != 1 or len(ends) != 1 or not starts[0] < ends[0]:
              raise SystemExit(f'Could not identify product-memory boundaries: starts={starts}, ends={ends}')

          start, end = starts[0], ends[0]
          section = lines[start:end]
          if len(section) < 8:
              raise SystemExit('Product-memory section unexpectedly short; refusing extraction.')

          module.parent.mkdir(parents=True, exist_ok=True)
          module.write_text('\n'.join(section).rstrip() + '\n', encoding='utf-8')

          marker = '/* PRODUCT MEMORY EXTRACTED TO assets/product-memory.js */'
          new_lines = lines[:start] + [marker] + lines[end:]
          new_script = '<script>\n' + '\n'.join(new_lines) + '\n</script>'
          html = html[:target.start()] + new_script + html[target.end():]
          html = html.replace(marker, '<script src="assets/product-memory.js"></script>', 1)
          index.write_text(html, encoding='utf-8')
          print(f'Extracted product-memory lines: {len(section)}')
          print(f'Product-memory bytes: {len(module.read_bytes())}')

      - name: Validate product memory extraction
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/product-memory.js').read_text(encoding='utf-8')
          link = '<script src="assets/product-memory.js"></script>'
          if html.count(link) != 1:
              raise SystemExit(f'Expected one product-memory link, found {html.count(link)}')
          if 'SON KULLANILAN ÜRÜNLER' in html:
              raise SystemExit('Product-memory section remains inline.')
          if 'function topluIskontoUygula' not in html:
              raise SystemExit('Boundary function disappeared from index.html.')
          if not js.strip():
              raise SystemExit('Product-memory module is empty.')
          print('Product-memory extraction validation passed.')

      - name: Commit extracted module
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/product-memory.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract product memory module [refactor-bot]'
          git push origin HEAD:project-context
