name: Deploy WEICON ASIST to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject legacy customer memory card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          tag = '<script src="./js/customers/customer-memory-card.js?v=3"></script>'
          s = re.sub(r'<script src="\./js/customers/customer-memory-card\.js\?v=[^\"]+"></script>\s*', '', s)
          marker = '</body>'
          if marker in s:
              s = s.replace(marker, tag + '\n' + marker, 1)
          else:
              s += '\n' + tag + '\n'
          p.write_text(s, encoding='utf-8')
          print('Customer memory integration v3 injected into deployed index.html')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
