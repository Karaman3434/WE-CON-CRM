name: Extract Card Photo AI

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-card-photo-ai:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Locate and extract card-photo block
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          module_path = Path('assets/card-photo-ai.js')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="assets/card-photo-ai.js"></script>'
          if tag in html:
              print('Card-photo AI block already externalized.')
          else:
              start_re = re.compile(r'//\s*KARTTAN/TABELADAN DOLDUR\b[^\n]*')
              end_re = re.compile(r'\n//\s*=+\s*\n</script>\s*\n<script src="assets/product-entry\.js"></script>')
              start_match = start_re.search(html)
              end_match = end_re.search(html, start_match.end() if start_match else 0)
              if not start_match or not end_match or end_match.start() <= start_match.start():
                  raise SystemExit('Card-photo AI boundaries were not found; refusing to modify index.html.')
              start = start_match.start()
              end = end_match.start()
              block = html[start:end]
              required = ['function kartFotoGonder','function kartFotoJpegeDonustur','function kartFotoSecildi','function yetkiliIletisimFotoSecildi','function teslimatAdresiFotoSecildi']
              for needle in required:
                  if needle not in block:
                      raise SystemExit(f'Required card-photo symbol missing: {needle}')
              module_path.write_text(block.rstrip() + '\n', encoding='utf-8')
              html = html[:start] + tag + '\n' + html[end:]
              path.write_text(html, encoding='utf-8')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          module = Path('assets/card-photo-ai.js').read_text(encoding='utf-8')
          if html.count('<script src="assets/card-photo-ai.js"></script>') != 1:
              raise SystemExit('Expected exactly one card-photo-ai.js script tag.')
          for name in ['kartFotoGonder','kartFotoJpegeDonustur','kartFotoSecildi','yetkiliIletisimFotoSecildi','teslimatAdresiFotoSecildi']:
              if not re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', module):
                  raise SystemExit(f'Card-photo function missing: {name}')
          if 'assets/product-entry.js' not in html:
              raise SystemExit('Expected product-entry.js script ordering was not preserved.')
          print('Card-photo AI extraction validated.')

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/card-photo-ai.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract card photo AI [refactor-bot]'
          git push origin HEAD:project-context

# Trigger comment: workflow is intentionally isolated to project-context.
