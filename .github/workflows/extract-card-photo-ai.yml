name: Extract Card Photo AI

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-card-photo-ai:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Repair and validate card-photo extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          module_path = Path('assets/card-photo-ai.js')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="assets/card-photo-ai.js"></script>'
          product_tag = '<script src="assets/product-entry.js"></script>'

          # The first extraction left the external tag inside an inline script.
          # Repair that exact boundary without touching application logic.
          malformed = re.compile(
              r'//\s*=+\s*\n<script src="assets/card-photo-ai\.js"></script>\s*\n'
              r'//\s*=+\s*\n</script>\s*\n'
              r'<script src="assets/product-entry\.js"></script>\s*\n<script>\s*\n'
          )
          if malformed.search(html):
              html = malformed.sub(
                  '</script>\n' + tag + '\n' + product_tag + '\n<script>\n',
                  html,
                  count=1
              )
              path.write_text(html, encoding='utf-8')
              print('Repaired malformed card-photo script boundary.')

          html = path.read_text(encoding='utf-8')
          if tag not in html:
              raise SystemExit('card-photo-ai.js script tag is missing.')

          module = module_path.read_text(encoding='utf-8')
          for name in [
              'kartFotoGonder',
              'kartFotoJpegeDonustur',
              'kartFotoSecildi',
              'yetkiliIletisimFotoSecildi',
              'teslimatAdresiFotoSecildi'
          ]:
              if not re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', module):
                  raise SystemExit(f'Card-photo function missing: {name}')

          expected = '</script>\n<script src="assets/card-photo-ai.js"></script>\n<script src="assets/product-entry.js"></script>\n<script>'
          if expected not in html:
              raise SystemExit('Card-photo/product-entry script boundary is invalid.')
          if html.count(tag) != 1:
              raise SystemExit('Expected exactly one card-photo-ai.js script tag.')
          if html.count(product_tag) != 1:
              raise SystemExit('Expected exactly one product-entry.js script tag.')

          print('Card-photo AI extraction and script boundaries validated.')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair card photo script boundary [refactor-bot]'
          git push origin HEAD:project-context

# Trigger comment: workflow is intentionally isolated to project-context.
