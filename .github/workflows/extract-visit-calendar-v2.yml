name: Extract Visit Calendar V2

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-visit-calendar:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Locate and extract visit calendar
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          module_path = Path('assets/visit-calendar.js')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="assets/visit-calendar.js"></script>'

          if tag in html:
              print('Visit calendar already externalized.')
          else:
              start_re = re.compile(r'//[^\n]*ZİYARET TAKVİMİ[^\n]*')
              next_section_re = re.compile(r'//\s*=+[^\n]*')
              start_match = start_re.search(html)
              end_match = next_section_re.search(html, start_match.end() if start_match else 0)

              if not start_match or not end_match or end_match.start() <= start_match.start():
                  raise SystemExit('Visit calendar boundaries were not found; refusing to modify index.html.')

              start = start_match.start()
              end = end_match.start()
              block = html[start:end]

              if not re.search(r'\bfunction\s+[A-Za-z_$][\w$]*\s*\(', block):
                  raise SystemExit('Visit calendar block contains no function declarations; refusing to extract.')

              module_path.write_text(block.rstrip() + '\n', encoding='utf-8')
              html = html[:start] + tag + '\n\n' + html[end:]
              path.write_text(html, encoding='utf-8')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          module = Path('assets/visit-calendar.js').read_text(encoding='utf-8')

          if html.count('<script src="assets/visit-calendar.js"></script>') != 1:
              raise SystemExit('Expected exactly one visit-calendar.js script tag.')
          if re.search(r'//[^\n]*ZİYARET TAKVİMİ[^\n]*', html):
              raise SystemExit('Inline visit calendar section marker remains in index.html.')
          if not re.search(r'\bfunction\s+[A-Za-z_$][\w$]*\s*\(', module):
              raise SystemExit('Extracted visit calendar module contains no function declarations.')

          print('Visit calendar extraction validated.')

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/visit-calendar.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract visit calendar [refactor-bot]'
          git push origin HEAD:project-context
