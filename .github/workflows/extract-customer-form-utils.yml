name: Extract Customer Form Utils
on:
  push:
    branches: [project-context]
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0
      - name: Extract customer form helpers
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          tag='<script src="assets/customer-form-utils.js"></script>'
          if tag not in h:
            start=h.find('function getDynamicCustomerName(){')
            end=h.find('function buildEmailBody(){', start)
            if start<0 or end<0: raise SystemExit('Customer form boundaries not found; refusing modification.')
            block=h[start:end]
            for n in ['getDynamicCustomerName','getDynamicCustomerSehir','getDynamicCustomerVade','getDynamicCustomerFatura','getModLabel','getDynamicCustomerYetkili','getDynamicCustomerYetkiliIletisim','getDynamicCustomerKargo','getDynamicCustomerTeslimatAdresi','custTeslimatToggle']:
              if ('function '+n+'(') not in block: raise SystemExit('Missing '+n)
            h=h[:start]+tag+'\n\n'+h[end:]
            p.write_text(h,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          if h.count('<script src="assets/customer-form-utils.js"></script>')!=1: raise SystemExit('Expected one customer-form-utils script tag.')
          for n in ['getDynamicCustomerName','getDynamicCustomerSehir','getDynamicCustomerVade','getDynamicCustomerFatura','getModLabel','getDynamicCustomerYetkili','getDynamicCustomerYetkiliIletisim','getDynamicCustomerKargo','getDynamicCustomerTeslimatAdresi','custTeslimatToggle']:
            if re.search(r'\bfunction\s+'+re.escape(n)+r'\s*\(',h): raise SystemExit('Inline function remains: '+n)
          m=Path('assets/customer-form-utils.js').read_text(encoding='utf-8')
          for n in ['getDynamicCustomerName','getDynamicCustomerSehir','getDynamicCustomerVade','getDynamicCustomerFatura','getModLabel','getDynamicCustomerYetkili','getDynamicCustomerYetkiliIletisim','getDynamicCustomerKargo','getDynamicCustomerTeslimatAdresi','custTeslimatToggle']:
            if not re.search(r'\bfunction\s+'+re.escape(n)+r'\s*\(',m): raise SystemExit('Missing module function: '+n)
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/customer-form-utils.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract customer form helpers [refactor-bot]'
          git push origin HEAD:project-context
