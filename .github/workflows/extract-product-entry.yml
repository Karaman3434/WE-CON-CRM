name: Extract Product Entry

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-product-entry:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract the verified product-entry section in place
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          module = Path('assets/product-entry.js')
          html = index.read_text(encoding='utf-8')
          pattern = re.compile(r'<script>(.*?)</script>', re.DOTALL | re.IGNORECASE)
          scripts = list(pattern.finditer(html))
          target = max(scripts, key=lambda m: len(m.group(1)))
          lines = target.group(1).splitlines()

          start_marker = 'YENİ ÜRÜN EKLE'
          end_marker = '--- Müşteri kalıcı ID sistemi'
          starts = [i for i,line in enumerate(lines) if start_marker in line]
          ends = [i for i,line in enumerate(lines) if end_marker in line]
          if len(starts) != 1 or len(ends) != 1 or not starts[0] < ends[0]:
              raise SystemExit(f'Could not identify unique product-entry boundaries: starts={starts}, ends={ends}')

          start = starts[0]
          end = ends[0]
          section = lines[start:end]
          if len(section) < 10:
              raise SystemExit('Product-entry section unexpectedly short; refusing extraction.')

          module.parent.mkdir(parents=True, exist_ok=True)
          module.write_text('\n'.join(section).rstrip() + '\n', encoding='utf-8')

          new_lines = lines[:start] + ['/* PRODUCT ENTRY EXTRACTED TO assets/product-entry.js */'] + lines[end:]
          new_body = '\n'.join(new_lines)
          old_script = target.group(0)
          new_script = '<script>\n' + new_body + '\n</script>'
          html = html[:target.start()] + new_script + html[target.end():]

          link = '<script src="assets/product-entry.js"></script>'
          html = html.replace('/* PRODUCT ENTRY EXTRACTED TO assets/product-entry.js */', link, 1)
          index.write_text(html, encoding='utf-8')
          print(f'Extracted product-entry lines: {len(section)}')
          print(f'Product-entry bytes: {len(module.read_bytes())}')

      - name: Validate product-entry extraction
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/product-entry.js').read_text(encoding='utf-8')
          link = '<script src="assets/product-entry.js"></script>'
          if html.count(link) != 1:
              raise SystemExit(f'Expected one product-entry link, found {html.count(link)}')
          if 'YENİ ÜRÜN EKLE' in html:
              raise SystemExit('Product-entry section marker remains inline.')
          if '--- Müşteri kalıcı ID sistemi' in js:
              raise SystemExit('Customer-ID section leaked into product-entry module.')
          if not js.strip():
              raise SystemExit('Product-entry module is empty.')
          print('Product-entry extraction validation passed.')

      - name: Commit extracted module
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/product-entry.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract product entry module [refactor-bot]'
          git push origin HEAD:project-context
