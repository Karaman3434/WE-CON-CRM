name: Apply approved islem popup design

on:
  push:
    paths:
      - '.github/workflows/apply-islem-popup-design.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply approved popup design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* WEICON APPROVED ISLEM POPUP DESIGN V4 */'
          if marker not in s:
              css = r'''<style id="weicon-approved-islem-popup-v4">
          /* WEICON APPROVED ISLEM POPUP DESIGN V4 */
          @media screen and (max-width: 700px) {
            #musteriKartModal > div {
              width: calc(100vw - 32px) !important;
              max-width: calc(100vw - 32px) !important;
              padding: 16px !important;
              border-radius: 16px !important;
              box-sizing: border-box !important;
            }
            #musteriKartModal #musteriKartAd {
              font-size: 24px !important;
              line-height: 1.15 !important;
              margin-bottom: 6px !important;
            }
            #musteriKartModal #musteriKartKodu {
              font-size: 13px !important;
              margin-bottom: 5px !important;
            }
            #musteriKartModal #musteriKartBilgi {
              font-size: 16px !important;
              margin-bottom: 12px !important;
            }
            #musteriKartModal #musteriKartZiyaretBilgi,
            #musteriKartModal #musteriKartAcikSurecUyari {
              font-size: 15px !important;
            }
            #musteriKartModal button {
              min-height: 58px !important;
              padding: 10px 12px !important;
              border-radius: 10px !important;
              font-size: 17px !important;
              line-height: 1.15 !important;
              box-sizing: border-box !important;
            }
            #musteriKartModal .sayac-rozeti {
              min-width: 34px !important;
              height: 34px !important;
              line-height: 34px !important;
              font-size: 17px !important;
            }
          }
          @media screen and (min-width: 701px) {
            #musteriKartModal > div {
              width: calc(100vw - 40px) !important;
              max-width: 1100px !important;
            }
            #musteriKartModal #musteriKartAd { font-size: 30px !important; }
            #musteriKartModal button { font-size: 20px !important; min-height: 64px !important; }
          }
          </style>'''
              js = r'''<script id="weicon-approved-islem-popup-v4-js">
          (function(){
            function addClose(){
              var panel=document.querySelector('#musteriKartModal > div');
              if(!panel || panel.querySelector('.weicon-approved-islem-close')) return;
              var b=document.createElement('button');
              b.type='button';
              b.className='weicon-approved-islem-close';
              b.textContent='×';
              b.setAttribute('aria-label','Kapat');
              b.onclick=function(){ if(typeof musteriKartKapat==='function') musteriKartKapat(); else { var m=document.getElementById('musteriKartModal'); if(m) m.style.display='none'; } };
              b.style.cssText='position:absolute;top:10px;right:12px;width:38px;height:38px;min-height:0!important;padding:0!important;border:0!important;background:transparent!important;color:#003a70!important;font-size:32px!important;font-weight:400!important;line-height:38px!important;box-shadow:none!important;border-radius:50%!important;z-index:5;cursor:pointer;';
              panel.style.position='relative';
              panel.appendChild(b);
            }
            document.addEventListener('click',function(e){
              var t=e.target;
              if(t && t.closest && (t.closest('#musteriKartModal') || t.closest('[onclick*="musteriKartModalaGit"]'))) setTimeout(addClose,0);
            });
            setInterval(function(){
              var m=document.getElementById('musteriKartModal');
              if(m && getComputedStyle(m).display!=='none') addClose();
            },500);
          })();
          </script>'''
              s = s.replace('</head>', css + '\n' + js + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Uygula onaylanan buyuk islem popup tasarimi'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-islem-popup-design.yml || true
          git commit -m 'Geçici popup tasarım workflowunu kaldır' || true
          git push || true
