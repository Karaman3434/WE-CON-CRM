name: Restore correct customer popup and enlarge operations popup
on:
  push:
    paths:
      - '.github/workflows/restore-correct-popup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore correct popup files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html,n=re.subn(r'\s*<script id="weicon-islem-popup-v3">.*?</script>\s*','\n',html,flags=re.S)
          print('Removed incorrect v3 override:',n)
          p.write_text(html,encoding='utf-8')
          PY
          curl -fsSL 'https://raw.githubusercontent.com/Karaman3434/WE-CON-CRM/58d5d9abdad7393b3a249ed93826a7d78fe8fdec/sw.js' -o sw.js
          rm -f css/approved-main-popup.css
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name 'WEICON CRM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js css/approved-main-popup.css
          git commit -m 'Restore customer popup and correct operations popup structure [skip ci]'
          git push
          git rm .github/workflows/restore-correct-popup.yml
          git commit -m 'Remove temporary popup repair workflow [skip ci]'
          git push
