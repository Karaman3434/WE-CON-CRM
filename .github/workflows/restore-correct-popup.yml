name: Restore correct customer popup and enlarge operations popup

on:
  push:
    paths:
      - '.github/workflows/restore-correct-popup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore popup structure
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Remove the previous automatic v3 restyling that incorrectly shrank
          # the approved second-level İşlemler popup.
          html, n = re.subn(
              r'\s*<script id="weicon-islem-popup-v3">.*?</script>\s*',
              '\n', html, flags=re.S
          )
          print('Removed v3 popup override:', n)

          p.write_text(html, encoding='utf-8')

          # Restore the service worker from the exact pre-error revision.
          import subprocess
          subprocess.run(['git', 'checkout', '58d5d9abdad7393b3a249ed93826a7d78fe8fdec', '--', 'sw.js'], check=True)

      - name: Remove incorrect popup CSS
        shell: bash
        run: rm -f css/approved-main-popup.css

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "WEICON CRM Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js css/approved-main-popup.css .github/workflows/restore-correct-popup.yml
          git commit -m "Restore customer popup and enlarge approved operations popup [skip ci]"
          git push
          git rm .github/workflows/restore-correct-popup.yml
          git commit -m "Remove temporary popup repair workflow [skip ci]"
          git push
