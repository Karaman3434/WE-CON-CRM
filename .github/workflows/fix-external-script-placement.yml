name: Fix External Script Placement

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  fix-script-placement:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Repair extracted script placement
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # ui-helpers is duplicated: keep the body copy only, because this
          # helper measures DOM elements and should execute after the body exists.
          ui_tag = '<script src="assets/ui-helpers.js"></script>'
          head_match = re.search(r'<head>(.*?)</head>', html, re.DOTALL | re.IGNORECASE)
          if not head_match:
              raise SystemExit('Could not locate <head>.')
          head = head_match.group(1)
          if head.count(ui_tag) != 1:
              raise SystemExit(f'Expected one ui-helpers tag in head, found {head.count(ui_tag)}.')
          head = head.replace(ui_tag, '', 1)
          html = html[:head_match.start(1)] + head + html[head_match.end(1):]

          # These modules were accidentally inserted inside the large inline
          # script. Move each tag out while preserving its original position.
          for asset in ['product-entry.js', 'search-history.js', 'product-memory.js']:
              pattern = re.compile(
                  r'<script\s+src="assets/' + re.escape(asset) + r'"\s*>\s*</script>',
                  re.IGNORECASE,
              )
              matches = list(pattern.finditer(html))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one misplaced tag for {asset}, found {len(matches)}.')
              html = pattern.sub(
                  '</script>\n<script src="assets/' + asset + '"></script>\n<script>',
                  html,
                  count=1,
              )

          path.write_text(html, encoding='utf-8')

          # Validate all extracted script tags are external and unique.
          assets = ['core-utils.js', 'ui-helpers.js', 'product-entry.js', 'search-history.js', 'product-memory.js']
          for asset in assets:
              tag = '<script src="assets/' + asset + '"></script>'
              if html.count(tag) != 1:
                  raise SystemExit(f'Expected exactly one external tag for {asset}, found {html.count(tag)}.')

          # After repair, normal <script>...</script> blocks must not contain
          # any extracted asset reference.
          inline_blocks = re.findall(r'<script>(.*?)</script>', html, re.DOTALL | re.IGNORECASE)
          for block in inline_blocks:
              for asset in assets:
                  if 'assets/' + asset in block:
                      raise SystemExit(f'{asset} remains inside an inline script.')

          print('Extracted script placement validation passed.')

      - name: Chrome smoke test
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/weicon-http.log 2>&1 &
          echo $! > /tmp/weicon-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/index.html > /dev/null && break; sleep 1; done
          timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --enable-logging=stderr --log-level=0 --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8080/index.html > /tmp/weicon-dom.html 2> /tmp/weicon-chrome.log
          test -s /tmp/weicon-dom.html
          grep -q 'WEICON ASIST' /tmp/weicon-dom.html
          for asset in core-utils.js ui-helpers.js product-entry.js search-history.js product-memory.js; do grep -q "assets/$asset" /tmp/weicon-dom.html; done
          if grep -Eiq 'Uncaught SyntaxError|Uncaught ReferenceError|Failed to load resource' /tmp/weicon-chrome.log; then
            cat /tmp/weicon-chrome.log
            exit 1
          fi
          echo 'External script placement Chrome smoke test passed.'

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair extracted script placement [refactor-bot]'
          git push origin HEAD:project-context

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/weicon-http.pid ]; then kill "$(cat /tmp/weicon-http.pid)" || true; fi
