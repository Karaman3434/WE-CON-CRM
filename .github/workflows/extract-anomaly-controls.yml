name: Extract Anomaly Controls

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-anomaly-controls:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract anomaly controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="assets/anomaly-controls.js"></script>'

          if tag not in html:
              section_marker = '// ============================================================\n// ANOMALİ KONTROLÜ'
              marker_var = 'var anomaliUyariKaynagi = null;'
              var_pos = html.find(marker_var)
              start = html.rfind(section_marker, 0, var_pos + 1)
              marker_pos = html.find('// DERİN AI ANALİZİ', start)
              if start < 0 or var_pos < 0 or marker_pos < 0:
                  raise SystemExit('Anomaly control boundaries were not found; refusing to modify index.html.')

              end = html.rfind('// ============================================================', start, marker_pos)
              if end < 0 or end <= start:
                  raise SystemExit('Anomaly section end separator was not found; refusing to modify index.html.')

              block = html[start:end]
              expected = [
                  'function hareketAnomaliKontrolEt',
                  'function anomaliUyariPopupGoster',
                  'function anomaliUyariGormezdenGel',
                  'function anomaliUyariGeriDon',
                  'function anomaliUyariKapat',
              ]
              for needle in expected:
                  if needle not in block:
                      raise SystemExit(f'Expected function not found in extraction block: {needle}')

              # Remove the inline block first. Recalculate the closing script
              # position afterwards because the document length has changed.
              html = html[:start] + html[end:]
              close_pos = html.find('</script>', marker_pos - len(block))
              if close_pos < 0:
                  raise SystemExit('Containing inline script closing tag was not found after extraction.')
              close_end = close_pos + len('</script>')
              html = html[:close_end] + '\n' + tag + html[close_end:]
              path.write_text(html, encoding='utf-8')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          tag = '<script src="assets/anomaly-controls.js"></script>'
          if html.count(tag) != 1:
              raise SystemExit('Expected exactly one anomaly-controls.js script tag.')
          if 'var anomaliUyariKaynagi = null;' in html:
              raise SystemExit('Inline anomaly-control state remains in index.html.')
          for name in ['hareketAnomaliKontrolEt','anomaliUyariPopupGoster','anomaliUyariGormezdenGel','anomaliUyariGeriDon','anomaliUyariKapat']:
              if re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', html):
                  raise SystemExit(f'Inline anomaly function remains: {name}')

          for m in re.finditer(r'<script\b[^>]*>(.*?)</script>', html, re.DOTALL | re.IGNORECASE):
              if tag in m.group(0):
                  raise SystemExit('External anomaly script tag is nested inside an inline script block.')

          module = Path('assets/anomaly-controls.js').read_text(encoding='utf-8')
          for name in ['hareketAnomaliKontrolEt','anomaliUyariPopupGoster','anomaliUyariGormezdenGel','anomaliUyariGeriDon','anomaliUyariKapat']:
              if not re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', module):
                  raise SystemExit(f'Function missing from extracted module: {name}')

          print('Anomaly controls extraction validated.')

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/anomaly-controls.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract anomaly controls [refactor-bot]'
          git push origin HEAD:project-context
