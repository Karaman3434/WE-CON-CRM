name: Extract Top Menu UI

on:
  push:
    branches: [project-context]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 0

      - name: Extract independent top menu helpers
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          tag = '<script src="assets/top-menu-ui.js"></script>'

          if tag not in h:
              start = h.find('function ustMenuAcKapat(){')
              end = h.find('function pinDegistir(){', start)
              if start < 0 or end < 0:
                  raise SystemExit('Top menu boundaries not found; refusing modification.')

              block = h[start:end]
              for n in ['ustMenuAcKapat', 'ustMenuAyarlaraGit']:
                  if ('function ' + n + '(') not in block:
                      raise SystemExit('Missing ' + n)

              Path('assets/top-menu-ui.js').write_text(
                  "// WE-CON-CRM - independent top menu UI helpers\n" + block,
                  encoding='utf-8'
              )
              h = h[:start] + tag + '\n' + h[end:]
              p.write_text(h, encoding='utf-8')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          h = Path('index.html').read_text(encoding='utf-8')
          m = Path('assets/top-menu-ui.js').read_text(encoding='utf-8')

          if h.count('<script src="assets/top-menu-ui.js"></script>') != 1:
              raise SystemExit('Expected exactly one top-menu-ui script tag.')

          for n in ['ustMenuAcKapat', 'ustMenuAyarlaraGit']:
              if re.search(r'\bfunction\s+' + re.escape(n) + r'\s*\(', h):
                  raise SystemExit('Inline function remains: ' + n)
              if not re.search(r'\bfunction\s+' + re.escape(n) + r'\s*\(', m):
                  raise SystemExit('Missing module function: ' + n)

          if 'window.fbSet' in m or 'localStorage' in m or 'sessionStorage' in m:
              raise SystemExit('Top menu module unexpectedly contains persistence access.')

          print('Top menu UI extraction validated.')

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/top-menu-ui.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract top menu UI [refactor-bot]'
          git push origin HEAD:project-context
