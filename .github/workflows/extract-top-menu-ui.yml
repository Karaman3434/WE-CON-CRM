name: Extract Top Menu UI

on:
  push:
    branches:
      - project-context

permissions:
  contents: write

jobs:
  extract-top-menu-ui:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-context
          fetch-depth: 1

      - name: Extract independent top menu helpers
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          tag = '<script src="assets/top-menu-ui.js"></script>'
          if tag not in h:
              start = h.find('function ustMenuAcKapat(){')
              end = h.find('function pinDegistir(){', start)
              if start < 0 or end < 0:
                  raise SystemExit('Top menu boundaries not found; refusing modification.')
              block = h[start:end]
              if 'fbSet' in block or 'fbGet' in block or 'localStorage' in block or 'sessionStorage' in block:
                  raise SystemExit('Top menu block has persistence dependency; refusing extraction.')
              for name in ['ustMenuAcKapat', 'ustMenuAyarlaraGit']:
                  if f'function {name}(' not in block:
                      raise SystemExit(f'Missing {name}')
              Path('assets/top-menu-ui.js').write_text(
                  '// WEICON ASIST - Top Menu UI helpers\n' + block,
                  encoding='utf-8'
              )
              h = h[:start] + tag + '\n\n' + h[end:]
              p.write_text(h, encoding='utf-8')

      - name: Validate extraction
        shell: python
        run: |
          from pathlib import Path
          import re
          h = Path('index.html').read_text(encoding='utf-8')
          m = Path('assets/top-menu-ui.js').read_text(encoding='utf-8')
          tag = '<script src="assets/top-menu-ui.js"></script>'
          if h.count(tag) != 1:
              raise SystemExit('Expected exactly one top-menu-ui script tag.')
          for name in ['ustMenuAcKapat', 'ustMenuAyarlaraGit']:
              if re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', h):
                  raise SystemExit(f'Inline function remains: {name}')
              if not re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', m):
                  raise SystemExit(f'Missing module function: {name}')
          if any(x in m for x in ['fbGet', 'fbSet', 'localStorage', 'sessionStorage']):
              raise SystemExit('Persistence dependency leaked into top-menu module.')
          print('Top menu UI extraction validated.')

      - name: Validate script balance
        shell: python
        run: |
          from pathlib import Path
          h = Path('index.html').read_text(encoding='utf-8')
          if h.count('<script>') != h.count('</script>'):
              raise SystemExit('Unbalanced inline script tags detected.')

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/top-menu-ui.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract top menu ui [refactor-bot]'
          git push origin HEAD:project-context
