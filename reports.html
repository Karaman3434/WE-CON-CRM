<!DOCTYPE html>
<!--
  WEICON ASİST — RAPORLAR v2
  =============================
  İki bölüm: Son İşlemler (arşivden okunan geçmiş kayıtlar) ve Görevler
  (Firebase "gorevler" yolu — eski uygulamayla AYNI). İstatistikler ve
  Ziyaret Takvimi bu ilk sürümde YOK, sonraki pakette eklenecek.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Raporlar</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="reports-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="home.html">Geri</a>
  <a class="nav-btn nav-btn--ana" href="home.html">Ana Sayfa</a>
  <button class="nav-btn nav-btn--menu" id="btnMenu">Menü</button>
</nav>

<main class="sayfa">

  <div class="sekme-secim sekme-secim--uc">
    <button class="sekme-btn sekme-btn--secili" data-sekme="islemler">Son İşlemler</button>
    <button class="sekme-btn" data-sekme="gorevler">Görevler</button>
    <button class="sekme-btn" data-sekme="istatistik">İstatistik</button>
  </div>

  <!-- SON İŞLEMLER -->
  <section id="sekmeIslemler" class="sekme-panel">
    <div id="islemlerListesi"></div>
    <p class="bos-mesaj" id="islemlerBosMesaj" hidden>Henüz kayıt yok.</p>
  </section>

  <!-- GÖREVLER -->
  <section id="sekmeGorevler" class="sekme-panel" hidden>
    <div class="gorev-ekle-kutu">
      <input type="text" id="gorevMusteri" placeholder="Müşteri / konu">
      <input type="text" id="gorevAciklama" placeholder="Görev açıklaması">
      <div class="gorev-tarih-satir">
        <input type="date" id="gorevTarih">
        <input type="time" id="gorevSaat">
      </div>
      <button class="gorev-ekle-buton" id="btnGorevEkle">+ Görev Ekle</button>
    </div>
    <div id="gorevListesiKapsayici"></div>
    <p class="bos-mesaj" id="gorevBosMesaj" hidden>Henüz görev yok.</p>
  </section>

  <!-- İSTATİSTİK -->
  <section id="sekmeIstatistik" class="sekme-panel" hidden>
    <div class="istatistik-kart-grid">
      <div class="istatistik-kart istatistik-kart--koyu">
        <div class="istatistik-baslik">Bu Ay Toplam</div>
        <div class="istatistik-deger" id="istBuAyToplam">0,00 EUR</div>
        <div class="istatistik-alt" id="istBuAySiparisSayisi">0 sipariş</div>
      </div>
      <div class="istatistik-kart">
        <div class="istatistik-baslik">Geçen Ay Toplam</div>
        <div class="istatistik-deger istatistik-deger--koyu" id="istGecenAyToplam">0,00 EUR</div>
        <div class="istatistik-alt" id="istGecenAySiparisSayisi">0 sipariş</div>
      </div>
    </div>

    <div class="istatistik-bolum-baslik">Son 6 Ay</div>
    <div id="istAylikListe"></div>

    <div class="istatistik-bolum-baslik">En Çok Satış Yapılan Müşteriler</div>
    <div id="istMusteriListe"></div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="reports-data.js"></script>
<script src="reports-render.js"></script>
</body>
</html>
