<!DOCTYPE html>
<!--
  WEICON ASİST — MÜŞTERİ KARTI v2
  ===================================
  Bir müşterinin profili: iletişim/vade/fatura bilgisi (düzenlenebilir),
  ziyaret geçmişi, sipariş/teklif geçmişi. customer.html'den seçilen
  müşteri "weicon_secili_musteri" üzerinden buraya taşınır.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Müşteri Kartı</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="customer-style.css">
<link rel="stylesheet" href="detail-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="customer.html">Geri</a>
  <a class="nav-btn nav-btn--ana" href="home.html">Ana Sayfa</a>
  <button class="nav-btn nav-btn--menu" id="btnMenu">Menü</button>
</nav>

<main class="sayfa">

  <div class="musteri-bilgileri-serit">
    <span>MÜŞTERİ BİLGİLERİ</span>
    <span class="musteri-bilgileri-etiket">Müşteri Kartı</span>
  </div>

  <div class="detay-ad" id="detayAd">—</div>
  <div class="detay-alt-baslik" id="detayAltBaslik">—</div>

  <div class="ozet-satir-3">
    <div class="ozet-alan">
      <div class="ozet-ikon">📅</div>
      <div class="ozet-metin"><div class="ozet-baslik">VADE</div><div class="ozet-deger" id="cariVade">-</div></div>
    </div>
    <div class="ozet-alan">
      <div class="ozet-ikon">📄</div>
      <div class="ozet-metin"><div class="ozet-baslik">FATURA</div><div class="ozet-deger" id="cariFatura">-</div></div>
    </div>
    <div class="ozet-alan">
      <div class="ozet-ikon">🚚</div>
      <div class="ozet-metin"><div class="ozet-baslik">KARGO</div><div class="ozet-deger" id="cariKargo">-</div></div>
    </div>
  </div>

  <div class="detay-ciro-kutu">
    <span class="detay-ciro-etiket">Toplam Ciro (Sipariş)</span>
    <span class="detay-ciro-deger" id="detayToplamCiro">0,00 EUR</span>
  </div>
  <button class="satis-yap-buton" id="btnSatisYap">🛒 Bu Müşteriye Satış Yap</button>

  <button class="duzenle-ac-buton" id="btnDuzenleAc">✏️ Bilgileri Düzenle</button>

  <section class="detay-bilgi-form" id="detayBilgiForm" hidden>
    <div class="form-satir-2">
      <input type="text" id="detayVade" placeholder="Vade">
      <input type="text" id="detayFatura" placeholder="Fatura Bilgisi">
    </div>
    <input type="text" id="detayKargo" placeholder="Kargo Firması">
    <button class="bilgi-kaydet-buton" id="btnBilgiKaydet">Bilgileri Güncelle</button>
  </section>

  <div class="adres-bolum-baslik">🧾 FATURA ADRESLERİ (<span id="faturaAdresSayisi">0</span>)</div>
  <section class="adres-bolum">
    <div id="faturaAdresListesi"></div>
    <div class="adres-ekle-satir">
      <input type="text" id="yeniFaturaEtiket" placeholder="Etiket (örn. Merkez)">
      <input type="text" id="yeniFaturaAdres" placeholder="Adres">
      <button class="adres-ekle-btn" data-tip="fatura">+ Ekle</button>
    </div>
  </section>

  <div class="adres-bolum-baslik">🚚 TESLİMAT ADRESLERİ (<span id="teslimatAdresSayisi">0</span>)</div>
  <section class="adres-bolum">
    <div id="teslimatAdresListesi"></div>
    <div class="adres-ekle-satir">
      <input type="text" id="yeniTeslimatEtiket" placeholder="Etiket (örn. Şube 2)">
      <input type="text" id="yeniTeslimatAdres" placeholder="Adres">
      <button class="adres-ekle-btn" data-tip="teslimat">+ Ekle</button>
    </div>
  </section>

  <div class="adres-bolum-baslik">👥 YETKİLİLER (<span id="yetkiliSayisi">0</span>)</div>
  <section class="adres-bolum">
    <div id="yetkiliListesi"></div>
    <div class="yetkili-ekle-satir">
      <input type="text" id="yeniYetkiliIsim" placeholder="İsim *">
      <input type="text" id="yeniYetkiliGorev" placeholder="Görev (örn. Satın Alma)">
      <div class="form-satir-2">
        <input type="tel" id="yeniYetkiliTelefon" placeholder="Telefon">
        <input type="email" id="yeniYetkiliEposta" placeholder="E-posta">
      </div>
      <button class="adres-ekle-btn" id="btnYetkiliEkle">+ Kişi Ekle</button>
    </div>
  </section>

  <div class="sekme-secim">
    <button class="sekme-btn sekme-btn--secili" data-sekme="siparisler">Sipariş Geçmişi</button>
    <button class="sekme-btn" data-sekme="ziyaretler">Ziyaret Geçmişi</button>
  </div>

  <section id="sekmeSiparisler" class="sekme-panel">
    <div id="detaySiparisListesi"></div>
    <p class="bos-mesaj" id="detaySiparisBos" hidden>Bu müşteriye ait kayıt yok.</p>
  </section>

  <section id="sekmeZiyaretler" class="sekme-panel" hidden>
    <div id="detayZiyaretListesi"></div>
    <p class="bos-mesaj" id="detayZiyaretBos" hidden>Ziyaret kaydı yok.</p>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="customer-data.js"></script>
<script src="reports-data.js"></script>
<script src="detail-render.js"></script>
</body>
</html>
