<!DOCTYPE html>
<!--
  WEICON ASİST — SEPET / HAREKET FORMU v4
  ==========================================
  Ürün Bul'dan seçilen ürünler burada iki gruba ayrılır: HESAPLANACAK
  (sarı) ve HESAPLANDI (yeşil) — ikisi de belge-tablosu tasarımıyla
  (SIRA/ÜRÜN BİLGİSİ/ADET/LİSTE/İSK/NET/TOPLAM/PRİM). Bir ürüne dokununca
  TEK hesaplama ekranı olan calc.html'e (Hızlı Hesapla) gidilir; orada
  hesaplanıp "Listeye Ekle" ile buraya, hesaplandı grubuna döner. Tüm
  ürünler hesaplanmadan Kaydet/Gönder aktif olmaz.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Sepet</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="belge-style.css">
<link rel="stylesheet" href="cart-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="product.html">Geri</a>
  <a class="nav-btn nav-btn--ana" href="home.html">Ana Sayfa</a>
  <button class="nav-btn nav-btn--menu" id="btnMenu">Menü</button>
</nav>

<main class="sayfa">

  <div class="kur-satiri">
    <label for="kurInput">Güncel Kur (EUR→TL)</label>
    <input type="number" id="kurInput" step="0.0001" placeholder="örn. 34.50">
  </div>

  <div id="grupSariAlani"></div>
  <div id="grupYesilAlani"></div>

  <p class="bos-mesaj" id="sepetBosMesaj" hidden>Sepetiniz boş. Önce Ürün Bul'dan ürün seçin.</p>

  <div class="sepet-alt-buton-satir" id="sepetAltButonSatiri" hidden>
    <button class="sepet-kaydet-btn" id="btnSepetKaydet">✓ Kaydet</button>
    <button class="sepet-gonder-btn" id="btnSepetGonder">📤 Gönder</button>
  </div>
  <p class="devam-uyari" id="devamUyari" hidden>⚠️ Devam etmeden önce sarı gruptaki tüm ürünleri hesapla.</p>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="ayarlar-sync.js"></script>
<script src="hareket-tablo.js"></script>
<script src="cart-data.js"></script>
<script src="cart-render.js"></script>
<script src="yarim-kalan-uyari.js"></script>
</body>
</html>
