<!--
  WEICON ASİST — ANA SAYFA v2 (yeniden yapılanma)
  =================================================
  Bu sayfa, önceki tasarımdaki ağır CSS efektlerini (çoklu gradyan, box-shadow +
  text-shadow yığılması) KASITLI OLARAK kullanmaz. Amaç: bazı cihaz/tarayıcı
  kombinasyonlarında görülen "DOM doğru ama ekrana çizilmiyor" türü render
  sorunlarına karşı en düşük riskli, en sade yapıyı kurmak.

  DOSYA YAPISI:
    home.html       — bu dosya: sadece HTML iskeleti, hiç inline style yok
    home-style.css  — TÜM görsel stiller burada (düz renkler, minimal gölge)
    home-data.js    — Firebase bağlantısı + veri çekme/hesaplama mantığı
    home-render.js  — veriyi okuyup DOM'a yazma mantığı

  dosyanın deseni (shell / style / data / render) tekrarlanacak.
-->
