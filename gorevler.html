<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Görevlerim</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="reports-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="raporlar.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>

<main class="sayfa">

  <div class="gorev-ekle-kutu">
    <input type="text" id="gorevMusteri" placeholder="Müşteri / konu">
    <input type="text" id="gorevAciklama" placeholder="Görev açıklaması">
    <div class="gorev-tarih-satir">
      <input type="date" id="gorevTarih">
      <input type="time" id="gorevSaat">
    </div>
    <button class="gorev-ekle-buton" id="btnGorevEkle">+ Görev Ekle</button>
  </div>
  <div class="gorev-arama-kutusu">
    <input type="text" id="gorevAra" placeholder="Görevlerde ara (müşteri/açıklama)..." autocomplete="off">
  </div>
  <div id="gorevListesiKapsayici"></div>
  <p class="bos-mesaj" id="gorevBosMesaj" hidden>Henüz görev yok.</p>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

</body>
</html>
