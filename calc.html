<!DOCTYPE html>
<!--
  WEICON ASİST — HIZLI HESAPLA v3
  ==================================
  Eski uygulamanın "hesaplaPopupModal"ıyla BİREBİR aynı: Döviz Kuru kartı +
  Temizle butonu, Ürün Bul, seçili ürün kartı, 2x2 fiyat/iskonto/adet
  kartları, İsk.Birim/TL Birim (turuncu) kartları, Toplam Euro / Fatura
  Toplam (navy) kartları, Prim EUR/TL, alt Kapat + Sepete Ekle.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Hızlı Hesapla</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.030926.1158.98">
<link rel="stylesheet" href="product-style.css?v=WG.030926.1158.98">
<link rel="stylesheet" href="calc-style.css?v=WG.030926.1158.98">
<link rel="stylesheet" href="belge-style.css?v=WG.030926.1245.100">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="home.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>
</div>
<div class="rota-etiketi"><b>Hızlı Hesapla</b></div>

<main class="sayfa">

  <div class="hc-ust-satir">
    <div class="hc-kur-kutu">
      <div class="hc-kur-ikon">€</div>
      <div class="hc-kur-metin">
        <div class="hc-kur-baslik">DÖVİZ KURU</div>
        <input type="number" id="kurInput" step="0.0001">
      </div>
    </div>
    <button class="hc-listeye-ekle-buton" id="btnHesapSepeteEkle">➕ LİSTEYE EKLE</button>
  </div>

  <div class="arama-kutusu">
    <input type="text" id="searchInput" placeholder="Ürün Bul — katalogda ara..." autocomplete="off">
    <span class="arama-ikon">🔍</span>
  </div>
  <div class="sonuc-listesi" id="sonucListesi"></div>

  <div class="hc-secili-urun-kutu" id="seciliUrunKutu" hidden>
    <div class="hc-secili-urun-baslik">Hesaplanacak Ürün</div>
    <div class="hc-secili-urun-ad-satir">
      <span id="seciliUrunAd"></span>
      <button id="btnUrunTemizle">✕</button>
    </div>
  </div>

  <div class="hc-grid-2">
    <div class="hc-beyaz-kart">
      <div class="hc-beyaz-etiket">Liste Fiyatı (EUR)</div>
      <input type="number" step="0.01" id="hesListeFiyat" value="0">
    </div>
    <div class="hc-beyaz-kart">
      <div class="hc-beyaz-etiket">Dip (Maliyet) (EUR)</div>
      <input type="number" step="0.01" id="hesDipFiyat" value="0">
    </div>
  </div>
  <div class="hc-grid-2">
    <div class="hc-beyaz-kart">
      <div class="hc-beyaz-etiket">İsk (%)</div>
      <input type="number" step="0.1" id="hesIskonto" value="0">
    </div>
    <div class="hc-beyaz-kart">
      <div class="hc-beyaz-etiket">Adet</div>
      <input type="number" step="1" min="1" id="hesAdet" value="1">
    </div>
  </div>

  <div class="hc-grid-2">
    <div class="hc-turuncu-kart">
      <div class="hc-turuncu-baslik-satir"><span class="hc-turuncu-rozet">€</span><span>İsk. Birim Fiyat (EUR)</span></div>
      <div class="hc-turuncu-deger" id="rIskontoluFiyat">-</div>
    </div>
    <div class="hc-turuncu-kart">
      <div class="hc-turuncu-baslik-satir"><span class="hc-turuncu-rozet">TL</span><span>TL Birim Fiyat</span></div>
      <div class="hc-turuncu-deger" id="rTlBirimFiyat">-</div>
    </div>
  </div>

  <div class="hc-grid-2">
    <div class="hc-gri-kart">
      <span class="hc-gri-ikon">🏷</span>
      <div>
        <div class="hc-gri-baslik">Toplam Euro</div>
        <div class="hc-gri-deger" id="rToplamEuro">-</div>
      </div>
    </div>
    <div class="hc-navy-kart">
      <span class="hc-navy-ikon">📄</span>
      <div>
        <div class="hc-navy-baslik">Fatura Toplam (KDV Dahil)</div>
        <div class="hc-navy-deger" id="rFaturaToplam">-</div>
      </div>
    </div>
  </div>

  <div class="belge-genel-toplam-serit" style="border-radius:10px; margin:10px 0;">
    <span class="belge-gt-kur" id="rGenelToplamKur"></span>
    <span class="belge-gt-etiket">GENEL TOPLAM</span>
    <span class="belge-gt-deger" id="rGenelToplamDeger">-</span>
  </div>

  <div class="hc-grid-2">
    <div class="hc-prim-kutu"><span>Prim EUR</span><b id="rPrimEuro">-</b></div>
    <div class="hc-prim-kutu"><span>Prim TL</span><b id="rPrimTL">-</b></div>
  </div>

  <div class="hc-alt-buton-satir">
    <a class="hc-kapat-buton" id="btnHesapKapat" href="home.html">✕ Kapat</a>
    <button class="hc-temizle-buton" id="btnTemizle">🧹 Temizle</button>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js?v=WG.030926.0753.97"></script>
<script src="ust-sabit-olcum.js?v=WG.020926.1338.87"></script>
<script src="ayarlar-sync.js?v=WG.020926.1338.87"></script>
<script src="product-data.js?v=WG.020926.1338.87"></script>
<script src="cart-data.js?v=WG.020926.1338.87"></script>
<script src="customer-data.js?v=WG.030926.1158.98"></script>
<script src="hata-log.js?v=WG.020926.1338.87"></script>
<script src="calc-render.js?v=WG.030926.1214.99"></script>
<script src="yarim-kalan-uyari.js?v=WG.020926.1338.87"></script>
</body>
</html>
