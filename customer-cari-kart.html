<!DOCTYPE html>
<!-- WEICON ASİST V2 — VERSİYON: WG.260831.0053.46 — customer-cari-kart.html -->
<!--
  WEICON ASİST — CARİ KART v6
  ==============================
  Ana sayfa (main) TAMAMEN salt-görüntüleme: isim/şehir, Vade/Fatura/Kargo
  (yan yana, grid), sonra Fatura Adresi / Yetkili Kişi / Teslimat Adresi /
  Not blokları (sadece kart listesi, hiçbir buton yok). Tek eylem butonu:
  "✏️ Bilgiyi Düzenle" — açtığı "bilgiYonetOverlay" ekranı AKORDİYON
  şeklinde 4 bölüm sunar (CARİ BİLGİLERİ / YETKİLİ KİŞİ / TESLİMAT ADRESİ /
  NOT): başlığa dokunca açılır/kapanır, açılınca içerik + Ekle/Düzenle/Sil
  butonları görünür. CARİ BİLGİLERİ; isim/şehir/vade/fatura/kargo ve fatura
  adresi listesini bir arada tutar (Ekle = yeni fatura adresi; Düzenle =
  temel bilgiler veya bir fatura adresi seçimi; Sil = bir fatura adresi).
  Müşteri ADI şu an bilerek düzenlenebilir değil — uygulamada sipariş/
  rapor/görev/km kayıtları müşteri adını anahtar olarak kullanıyor, isim
  değişikliği bu bağlantıları koparabilir (ayrı, güvenli bir "yeniden
  adlandırma" özelliği gerekir).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Cari Kart</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="customer-style.css">
<link rel="stylesheet" href="detail-style.css">
<link rel="stylesheet" href="cari-kart-style.css">
<link rel="stylesheet" href="send-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="customer-detail.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>

<div class="cari-baslik-serit">
  <a class="cari-geri-ok" id="cariGeriOk" href="customer-detail.html">‹</a>
  <span>CARİ BİLGİ</span>
</div>

<main class="sayfa">

  <div class="cari-ad" id="cariKartAd">—</div>
  <div class="cari-alt-baslik" id="cariKartAltBaslik"></div>

  <div class="ozet-satir-3">
    <div class="ozet-alan"><div class="ozet-ikon">📅</div><div class="ozet-metin"><div class="ozet-baslik">VADE</div><div class="ozet-deger" id="ozetVadeDeger">—</div></div></div>
    <div class="ozet-alan"><div class="ozet-ikon">📄</div><div class="ozet-metin"><div class="ozet-baslik">FATURA</div><div class="ozet-deger" id="ozetFaturaDeger">—</div></div></div>
    <div class="ozet-alan"><div class="ozet-ikon">🚚</div><div class="ozet-metin"><div class="ozet-baslik">KARGO</div><div class="ozet-deger" id="ozetKargoDeger">—</div></div></div>
  </div>

  <!-- FATURA ADRESLERİ -->
  <div class="ck-blok-etiket ck-blok-etiket--fatura">
    <span>🧾 FATURA ADRESİ</span>
    <span class="ck-blok-sayac" id="faturaSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="faturaListesi"></div>
  </section>

  <!-- TESLİMAT ADRESLERİ -->
  <div class="ck-blok-etiket ck-blok-etiket--teslimat">
    <span>🚚 TESLİMAT ADRESİ</span>
    <span class="ck-blok-sayac" id="teslimatSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="teslimatListesi"></div>
  </section>

  <!-- YETKİLİ KİŞİLER -->
  <div class="ck-blok-etiket ck-blok-etiket--yetkili">
    <span>👤 YETKİLİ BİLGİSİ</span>
    <span class="ck-blok-sayac" id="yetkiliSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="yetkiliListesi"></div>
  </section>

  <!-- NOTLAR -->
  <div class="ck-blok-etiket ck-blok-etiket--not">
    <span>📝 NOT</span>
    <span class="ck-blok-sayac" id="notSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="notListesi"></div>
  </section>

  <a class="cari-kapat-buton" id="cariKapatBtn" href="customer-detail.html">Kapat</a>

  <button class="cari-yenibilgi-buton-icerde" id="btnBilgiYonetAc">✏️ Bilgiyi Düzenle</button>

  <!-- Sadece Müşteri Kartı'nda "İşlem Yap" ile buraya gelindiyse görünür -->
  <button class="cari-islemedevam-buton" id="btnIslemeDevam" hidden>▶️ İşleme Devam Et</button>

  <div class="tip-secim-overlay" id="tipSecimOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Ne için ürün arıyorsun?</div>
      <div class="tip-secim">
        <button class="tip-btn tip-btn--numune" data-tip="numune">NUMUNE</button>
        <button class="tip-btn tip-btn--teklif" data-tip="teklif">FİYAT<br>TEKLİFİ</button>
        <button class="tip-btn tip-btn--proforma" data-tip="proforma">PROFORMA<br>FATURA</button>
        <button class="tip-btn tip-btn--siparis" data-tip="siparis">SİPARİŞ</button>
      </div>
      <button class="tip-secim-vazgec-btn" id="btnTipSecimVazgec">Vazgeç</button>
    </div>
  </div>

</main>

<!-- "Bilgiyi Düzenle" — akordiyon: 4 başlık (CARİ BİLGİLERİ / YETKİLİ KİŞİ /
     TESLİMAT ADRESİ / NOT), her birine dokununca açılıp içerik + Ekle/
     Düzenle/Sil butonlarını gösterir. -->
<div class="overlay" id="bilgiYonetOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik">Bilgiyi Düzenle</div>
    <div class="sheet-alt">Bir başlığa dokun, ne yapmak istediğini seç.</div>

    <div id="akordiyonKapsayici"></div>

    <button class="sheet-secenek sheet-secenek--vazgec" data-kapat="bilgiYonetOverlay">Kapat</button>
  </div>
</div>

<!-- "Hangisini düzenlemek/silmek istiyorsun?" seçici -->
<div class="overlay" id="pickerOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="pickerBaslik">Hangisi?</div>
    <div class="sheet-alt" id="pickerAlt"></div>
    <div id="pickerListesi"></div>
    <button class="sheet-secenek sheet-secenek--vazgec" data-kapat="pickerOverlay">Vazgeç</button>
  </div>
</div>

<!-- Ekle/Düzenle formu -->
<div class="overlay" id="formOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="formBaslik">Form</div>
    <div id="formIcerik"></div>
    <div class="sheet-buton-satir">
      <button class="btn-vazgec" data-kapat="formOverlay">Vazgeç</button>
      <button class="btn-kaydet" id="formKaydetBtn">✓ Kaydet</button>
    </div>
  </div>
</div>

<!-- Silme onayı -->
<div class="overlay" id="silOnayOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik">Silinsin mi?</div>
    <div class="sheet-alt" id="silOnayMetin"></div>
    <div class="sheet-buton-satir">
      <button class="btn-vazgec" data-kapat="silOnayOverlay">Vazgeç</button>
      <button class="btn-kaydet btn-kaydet--tehlike" id="silOnaylaBtn">🗑️ Evet, Sil</button>
    </div>
  </div>
</div>

<div class="toast" id="ckToast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js?v=WG.010926.2127.79"></script>
<script src="customer-data.js?v=WG.010926.2127.79"></script>
<script src="reports-data.js?v=WG.010926.2127.79"></script>
<script src="reports-safety-fix.js?v=WG.010926.2127.79"></script>
<script src="hata-log.js?v=WG.010926.2127.79"></script>
<script src="cari-kart-render.js?v=WG.010926.2127.79"></script>
</body>
</html>
