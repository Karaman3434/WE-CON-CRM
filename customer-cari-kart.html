<!DOCTYPE html>
<!-- WEICON ASİST V2 — VERSİYON: WG.260826.1634.33 — customer-cari-kart.html -->
<!--
  WEICON ASİST — CARİ KART v3
  ==============================
  Dört blok: FATURA ADRESİ (ad+şehir+vade/fatura/kargo+açık adres),
  YETKİLİ KİŞİ (isim/görev/tel/eposta), TESLİMAT ADRESİ (açık adres),
  NOT (opsiyonel). Her blokta alanlar HER ZAMAN doğrudan düzenlenebilir
  (gizle/göster geçişi YOK — önceki sürümdeki "hidden CSS çakışması"
  hata sınıfını kökten ortadan kaldırır). Her blokta aynı satırda eşit
  boyutta Düzenle/Kaydet/Sil tuşları — Kaydet basılmadan hiçbir değişiklik
  kalıcı olmaz.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Cari Kart</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="customer-style.css">
<link rel="stylesheet" href="detail-style.css">
<link rel="stylesheet" href="cari-kart-style.css">
<link rel="stylesheet" href="send-style.css">
</head>
<body>

<div class="cari-baslik-serit">
  <a class="cari-geri-ok" id="cariGeriOk" href="customer-detail.html">‹</a>
  <span>CARİ KART</span>
</div>

<main class="sayfa">

  <div class="cari-ad" id="cariKartAd">—</div>
  <div class="cari-alt-baslik" id="cariKartAltBaslik"></div>

  <!-- FATURA ADRESİ -->
  <div class="ck-blok-etiket ck-blok-etiket--fatura">🧾 FATURA ADRESİ</div>
  <section class="ck-blok">
    <div class="ozet-satir-3">
      <div class="ozet-alan"><div class="ozet-ikon">📅</div><div class="ozet-metin"><div class="ozet-baslik">VADE</div><input type="text" id="ckVadeInput" class="ck-mini-input" placeholder="30 gün"></div></div>
      <div class="ozet-alan"><div class="ozet-ikon">📄</div><div class="ozet-metin"><div class="ozet-baslik">FATURA</div><input type="text" id="ckFaturaTuruInput" class="ck-mini-input" placeholder="TL fatura"></div></div>
      <div class="ozet-alan"><div class="ozet-ikon">🚚</div><div class="ozet-metin"><div class="ozet-baslik">KARGO</div><input type="text" id="ckKargoInput" class="ck-mini-input" placeholder="Alıcı öder"></div></div>
    </div>
    <div class="ck-adres-etiket">FATURA ADRESİ</div>
    <textarea id="ckFaturaAdresInput" class="ck-adres-textarea" rows="3" placeholder="Açık adres"></textarea>
    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" data-odak="ckVadeInput">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnFaturaKaydet">✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnFaturaSil">🗑 Sil</button>
    </div>
  </section>

  <!-- YETKİLİ KİŞİ -->
  <div class="ck-blok-etiket ck-blok-etiket--yetkili">👤 YETKİLİ KİŞİ</div>
  <section class="ck-blok">
    <div class="form-satir-2">
      <div>
        <label class="ck-yetkili-etiket" for="ckYetkiliIsimInput">İSİM SOYİSİM</label>
        <input type="text" id="ckYetkiliIsimInput" class="ck-yetkili-input" placeholder="İsim Soyisim">
      </div>
      <div>
        <label class="ck-yetkili-etiket" for="ckYetkiliGorevInput">GÖREV</label>
        <input type="text" id="ckYetkiliGorevInput" class="ck-yetkili-input" placeholder="örn. Satın Alma Sorumlusu">
      </div>
    </div>
    <div class="form-satir-2">
      <div>
        <label class="ck-yetkili-etiket" for="ckYetkiliTelInput">TELEFON</label>
        <input type="tel" id="ckYetkiliTelInput" class="ck-yetkili-input" placeholder="Telefon">
      </div>
      <div>
        <label class="ck-yetkili-etiket" for="ckYetkiliEpostaInput">E-POSTA</label>
        <input type="email" id="ckYetkiliEpostaInput" class="ck-yetkili-input" placeholder="E-posta">
      </div>
    </div>
    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" data-odak="ckYetkiliIsimInput">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnYetkiliKaydet">✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnYetkiliSil">🗑 Sil</button>
    </div>
  </section>

  <!-- TESLİMAT ADRESİ -->
  <div class="ck-blok-etiket ck-blok-etiket--teslimat">🚚 TESLİMAT ADRESİ</div>
  <section class="ck-blok">
    <div class="ck-adres-etiket ck-adres-etiket--yesil">TESLİMAT ADRESİ</div>
    <textarea id="ckTeslimatInput" class="ck-adres-textarea" rows="3" placeholder="Açık adres"></textarea>
    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" data-odak="ckTeslimatInput">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnTeslimatKaydet">✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnTeslimatSil">🗑 Sil</button>
    </div>
  </section>

  <!-- NOT -->
  <div class="ck-blok-etiket ck-blok-etiket--not">📝 NOT</div>
  <section class="ck-blok">
    <textarea id="ckNotInput" class="ck-adres-textarea" rows="3" placeholder="Ör: Sadece perşembe günleri teslimat kabul ediyor."></textarea>
    <p class="ck-not-aciklama">Not varsa, mail/WhatsApp mesaj metninin altına otomatik eklenir; boşsa hiç görünmez.</p>
    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" data-odak="ckNotInput">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnNotKaydet">✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnNotSil">🗑 Sil</button>
    </div>
  </section>

  <a class="cari-kapat-buton" id="cariKapatBtn" href="customer-detail.html">Kapat</a>

  <!-- Sadece Müşteri Kartı'nda "İşlem Yap" ile buraya gelindiyse görünür -->
  <button class="cari-islemedevam-buton" id="btnIslemeDevam" hidden>▶️ İşleme Devam Et</button>

  <div class="tip-secim-overlay" id="tipSecimOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Ne için ürün arıyorsun?</div>
      <div class="tip-secim">
        <button class="tip-btn tip-btn--numune" data-tip="numune">NUMUNE</button>
        <button class="tip-btn tip-btn--teklif" data-tip="teklif">FİYAT<br>TEKLİFİ</button>
        <button class="tip-btn tip-btn--proforma" data-tip="proforma">PROFORMA<br>FATURA</button>
        <button class="tip-btn tip-btn--siparis" data-tip="siparis">SİPARİŞ</button>
      </div>
      <button class="tip-secim-vazgec-btn" id="btnTipSecimVazgec">Vazgeç</button>
    </div>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="customer-data.js"></script>
<script src="cari-kart-render.js"></script>
</body>
</html>
