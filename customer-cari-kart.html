<!DOCTYPE html>
<!-- WEICON ASİST V2 — VERSİYON: W230826.0824.03 — customer-cari-kart.html -->
<!--
  WEICON ASİST — CARİ KART v4
  ==============================
  Dört blok: FATURA ADRESİ, YETKİLİ KİŞİ, TESLİMAT ADRESİ, NOT — her biri
  ÇOKLU KAYIT destekler (liste + kart görünümü). Her blokta tek bir
  "⚙️ Yönet" butonu var; tıklanınca Düzenle/Sil seçimi çıkar, birden
  fazla kayıt varsa "hangisi?" seçici gösterilir. Yeni kayıt eklemek için
  sayfa altındaki tek "➕ Yeni Bilgi Ekle" butonu kategori seçtirir.
  Önceki sürümdeki (v3) her blokta 3 ayrı buton + her zaman açık tekil
  alan tasarımı, çoklu kayıt ihtiyacı üzerine bu şekilde değiştirildi.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Cari Kart</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="customer-style.css">
<link rel="stylesheet" href="detail-style.css">
<link rel="stylesheet" href="cari-kart-style.css">
<link rel="stylesheet" href="send-style.css">
</head>
<body>

<div class="cari-baslik-serit">
  <a class="cari-geri-ok" id="cariGeriOk" href="customer-detail.html">‹</a>
  <span>CARİ KART</span>
</div>

<main class="sayfa">

  <div class="cari-ad" id="cariKartAd">—</div>
  <div class="cari-alt-baslik" id="cariKartAltBaslik"></div>

  <div class="ozet-satir-3">
    <div class="ozet-alan"><div class="ozet-ikon">📅</div><div class="ozet-metin"><div class="ozet-baslik">VADE</div><input type="text" id="ckVadeInput" class="ck-mini-input" placeholder="30 gün"></div></div>
    <div class="ozet-alan"><div class="ozet-ikon">📄</div><div class="ozet-metin"><div class="ozet-baslik">FATURA</div><input type="text" id="ckFaturaTuruInput" class="ck-mini-input" placeholder="TL fatura"></div></div>
    <div class="ozet-alan"><div class="ozet-ikon">🚚</div><div class="ozet-metin"><div class="ozet-baslik">KARGO</div><input type="text" id="ckKargoInput" class="ck-mini-input" placeholder="Alıcı öder"></div></div>
  </div>
  <button class="ck-ozet-kaydet-btn" id="btnOzetKaydet">✓ Vade / Fatura / Kargo Kaydet</button>

  <!-- FATURA ADRESLERİ -->
  <div class="ck-blok-etiket ck-blok-etiket--fatura">
    <span>🧾 FATURA ADRESİ</span>
    <span class="ck-blok-sayac" id="faturaSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="faturaListesi"></div>
    <button class="ck-yonet-btn" data-tip="fatura">⚙️ Yönet (Düzenle / Sil)</button>
  </section>

  <!-- YETKİLİ KİŞİLER -->
  <div class="ck-blok-etiket ck-blok-etiket--yetkili">
    <span>👤 YETKİLİ KİŞİ</span>
    <span class="ck-blok-sayac" id="yetkiliSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="yetkiliListesi"></div>
    <button class="ck-yonet-btn" data-tip="yetkili">⚙️ Yönet (Düzenle / Sil)</button>
  </section>

  <!-- TESLİMAT ADRESLERİ -->
  <div class="ck-blok-etiket ck-blok-etiket--teslimat">
    <span>🚚 TESLİMAT ADRESİ</span>
    <span class="ck-blok-sayac" id="teslimatSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="teslimatListesi"></div>
    <button class="ck-yonet-btn" data-tip="teslimat">⚙️ Yönet (Düzenle / Sil)</button>
  </section>

  <!-- NOTLAR -->
  <div class="ck-blok-etiket ck-blok-etiket--not">
    <span>📝 NOT</span>
    <span class="ck-blok-sayac" id="notSayac">0</span>
  </div>
  <section class="ck-blok">
    <div class="ck-kart-liste" id="notListesi"></div>
    <button class="ck-yonet-btn" data-tip="not">⚙️ Yönet (Düzenle / Sil)</button>
  </section>

  <a class="cari-kapat-buton" id="cariKapatBtn" href="customer-detail.html">Kapat</a>

  <!-- Sadece Müşteri Kartı'nda "İşlem Yap" ile buraya gelindiyse görünür -->
  <button class="cari-islemedevam-buton" id="btnIslemeDevam" hidden>▶️ İşleme Devam Et</button>

  <div class="tip-secim-overlay" id="tipSecimOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Ne için ürün arıyorsun?</div>
      <div class="tip-secim">
        <button class="tip-btn tip-btn--numune" data-tip="numune">NUMUNE</button>
        <button class="tip-btn tip-btn--teklif" data-tip="teklif">FİYAT<br>TEKLİFİ</button>
        <button class="tip-btn tip-btn--proforma" data-tip="proforma">PROFORMA<br>FATURA</button>
        <button class="tip-btn tip-btn--siparis" data-tip="siparis">SİPARİŞ</button>
      </div>
      <button class="tip-secim-vazgec-btn" id="btnTipSecimVazgec">Vazgeç</button>
    </div>
  </div>

</main>

<button class="yeni-bilgi-buton" id="btnYeniBilgiAc">➕ Yeni Bilgi Ekle</button>

<!-- "+ Yeni Bilgi Ekle" seçim sheet'i -->
<div class="overlay" id="yeniBilgiOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik">Ne eklemek istiyorsun?</div>
    <div class="sheet-alt">Bir kategori seç, bilgileri gir, kaydet.</div>
    <button class="sheet-secenek" data-tip="fatura"><span class="ikon">🧾</span> Yeni Fatura Adresi Ekle</button>
    <button class="sheet-secenek" data-tip="yetkili"><span class="ikon">👤</span> Yeni Yetkili Ekle</button>
    <button class="sheet-secenek" data-tip="teslimat"><span class="ikon">🚚</span> Yeni Teslimat Adresi Ekle</button>
    <button class="sheet-secenek" data-tip="not"><span class="ikon">📝</span> Yeni Not Ekle</button>
    <button class="sheet-secenek sheet-secenek--vazgec" data-kapat="yeniBilgiOverlay">Vazgeç</button>
  </div>
</div>

<!-- Düzenle/Sil seçim sheet'i (bölüm bazlı "Yönet" tuşu) -->
<div class="overlay" id="yonetOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="yonetBaslik">Yönet</div>
    <div class="sheet-alt">Ne yapmak istiyorsun?</div>
    <button class="sheet-secenek" id="yonetDuzenleBtn"><span class="ikon">✏️</span> Düzenle</button>
    <button class="sheet-secenek sheet-secenek--sil" id="yonetSilBtn"><span class="ikon">🗑️</span> Sil</button>
    <button class="sheet-secenek sheet-secenek--vazgec" data-kapat="yonetOverlay">Vazgeç</button>
  </div>
</div>

<!-- "Hangisini düzenlemek/silmek istiyorsun?" seçici -->
<div class="overlay" id="pickerOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="pickerBaslik">Hangisi?</div>
    <div class="sheet-alt" id="pickerAlt"></div>
    <div id="pickerListesi"></div>
    <button class="sheet-secenek sheet-secenek--vazgec" data-kapat="pickerOverlay">Vazgeç</button>
  </div>
</div>

<!-- Ekle/Düzenle formu -->
<div class="overlay" id="formOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik" id="formBaslik">Form</div>
    <div id="formIcerik"></div>
    <div class="sheet-buton-satir">
      <button class="btn-vazgec" data-kapat="formOverlay">Vazgeç</button>
      <button class="btn-kaydet" id="formKaydetBtn">✓ Kaydet</button>
    </div>
  </div>
</div>

<!-- Silme onayı -->
<div class="overlay" id="silOnayOverlay" hidden>
  <div class="sheet">
    <div class="sheet-baslik">Silinsin mi?</div>
    <div class="sheet-alt" id="silOnayMetin"></div>
    <div class="sheet-buton-satir">
      <button class="btn-vazgec" data-kapat="silOnayOverlay">Vazgeç</button>
      <button class="btn-kaydet btn-kaydet--tehlike" id="silOnaylaBtn">🗑️ Evet, Sil</button>
    </div>
  </div>
</div>

<div class="toast" id="ckToast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="customer-data.js"></script>
<script src="cari-kart-render.js"></script>
</body>
</html>
