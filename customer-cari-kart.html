<!DOCTYPE html>
<!-- WEICON ASİST V2 — VERSİYON: WG.260826.1524.28 — customer-cari-kart.html -->
<!--
  WEICON ASİST — CARİ KART v2
  ==============================
  Yeniden tasarlandı: tek FATURA ADRESİ bloğu (müşteri adı, şehir,
  vade/fatura/kargo, yetkili, açık adres), tek TESLİMAT ADRESİ bloğu
  (açık adres), tek opsiyonel NOT bloğu — her biri kendi Düzenle/Kaydet/
  Sil tuşlarıyla, satır içi (popup değil) düzenlenir. Çoklu adres/yetkili
  listesi kaldırıldı — sadeleştirme kasıtlı (eski programın çökme
  riskini azaltmak için).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Cari Kart</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="customer-style.css">
<link rel="stylesheet" href="detail-style.css">
<link rel="stylesheet" href="cari-kart-style.css">
<link rel="stylesheet" href="send-style.css">
</head>
<body>

<div class="cari-baslik-serit">
  <a class="cari-geri-ok" id="cariGeriOk" href="customer-detail.html">‹</a>
  <span>CARİ KART</span>
</div>

<main class="sayfa">

  <!-- FATURA ADRESİ bloğu -->
  <div class="ck-blok-etiket ck-blok-etiket--fatura">🧾 FATURA ADRESİ</div>
  <section class="ck-blok" id="ckFaturaBlok">
    <div id="ckFaturaGoruntule">
      <div class="ck-musteri-ad" id="ckMusteriAd">—</div>
      <div class="ck-musteri-sehir" id="ckMusteriSehir"></div>

      <div class="ozet-satir-3">
        <div class="ozet-alan"><div class="ozet-ikon">📅</div><div class="ozet-metin"><div class="ozet-baslik">VADE</div><div class="ozet-deger" id="ckVadeGoster">-</div></div></div>
        <div class="ozet-alan"><div class="ozet-ikon">📄</div><div class="ozet-metin"><div class="ozet-baslik">FATURA</div><div class="ozet-deger" id="ckFaturaTuruGoster">-</div></div></div>
        <div class="ozet-alan"><div class="ozet-ikon">🚚</div><div class="ozet-metin"><div class="ozet-baslik">KARGO</div><div class="ozet-deger" id="ckKargoGoster">-</div></div></div>
      </div>

      <div class="ck-yetkili-goster" id="ckYetkiliGoster">
        <div class="ck-yetkili-isim" id="ckYetkiliIsimGoster">👤 Yetkili eklenmedi</div>
        <div class="ck-yetkili-detay" id="ckYetkiliDetayGoster"></div>
      </div>

      <div class="ck-adres-etiket">AÇIK ADRES</div>
      <div class="ck-adres-goster" id="ckFaturaAdresGoster">Adres eklenmedi.</div>
    </div>

    <div id="ckFaturaDuzenle" hidden>
      <div class="form-satir-2">
        <input type="text" id="ckVadeInput" placeholder="Vade (örn. 30 gün)">
        <input type="text" id="ckFaturaTuruInput" placeholder="Fatura Türü (örn. TL fatura)">
      </div>
      <input type="text" id="ckKargoInput" placeholder="Kargo (örn. Alıcı ödemeli)">
      <div class="form-satir-2">
        <input type="text" id="ckYetkiliIsimInput" placeholder="Yetkili İsim Soyisim">
        <input type="text" id="ckYetkiliGorevInput" placeholder="Görev (örn. Satın Alma)">
      </div>
      <div class="form-satir-2">
        <input type="tel" id="ckYetkiliTelInput" placeholder="Telefon">
        <input type="email" id="ckYetkiliEpostaInput" placeholder="E-posta">
      </div>
      <textarea id="ckFaturaAdresInput" rows="3" placeholder="Açık adres"></textarea>
    </div>

    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" id="btnFaturaDuzenle">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnFaturaKaydet" hidden>✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnFaturaSil">🗑 Sil</button>
    </div>
  </section>

  <!-- TESLİMAT ADRESİ bloğu -->
  <div class="ck-blok-etiket ck-blok-etiket--teslimat">🚚 TESLİMAT ADRESİ</div>
  <section class="ck-blok" id="ckTeslimatBlok">
    <div id="ckTeslimatGoster" class="ck-adres-goster">Adres eklenmedi.</div>
    <textarea id="ckTeslimatInput" rows="3" placeholder="Açık adres" hidden></textarea>
    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" id="btnTeslimatDuzenle">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnTeslimatKaydet" hidden>✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnTeslimatSil">🗑 Sil</button>
    </div>
  </section>

  <!-- NOT bloğu (opsiyonel) -->
  <div class="ck-blok-etiket ck-blok-etiket--not">📝 NOT</div>
  <section class="ck-blok" id="ckNotBlok">
    <div id="ckNotGoster" class="ck-adres-goster">Not eklenmedi.</div>
    <textarea id="ckNotInput" rows="3" placeholder="Ör: Sadece perşembe günleri teslimat kabul ediyor." hidden></textarea>
    <p class="ck-not-aciklama">Not varsa, mail/WhatsApp mesaj metninin altına otomatik eklenir; boşsa hiç görünmez.</p>
    <div class="ck-buton-satir">
      <button class="ck-duzenle-btn" id="btnNotDuzenle">✏️ Düzenle</button>
      <button class="ck-kaydet-btn" id="btnNotKaydet" hidden>✓ Kaydet</button>
      <button class="ck-sil-btn" id="btnNotSil">🗑 Sil</button>
    </div>
  </section>

  <a class="cari-kapat-buton" id="cariKapatBtn" href="customer-detail.html">Kapat</a>

  <!-- Sadece Müşteri Kartı'nda "İşlem Yap" ile buraya gelindiyse görünür -->
  <button class="cari-islemedevam-buton" id="btnIslemeDevam" hidden>▶️ İşleme Devam Et</button>

  <div class="tip-secim-overlay" id="tipSecimOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Ne için ürün arıyorsun?</div>
      <div class="tip-secim">
        <button class="tip-btn tip-btn--numune" data-tip="numune">NUMUNE</button>
        <button class="tip-btn tip-btn--teklif" data-tip="teklif">FİYAT<br>TEKLİFİ</button>
        <button class="tip-btn tip-btn--proforma" data-tip="proforma">PROFORMA<br>FATURA</button>
        <button class="tip-btn tip-btn--siparis" data-tip="siparis">SİPARİŞ</button>
      </div>
      <button class="tip-secim-vazgec-btn" id="btnTipSecimVazgec">Vazgeç</button>
    </div>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="customer-data.js"></script>
<script src="cari-kart-render.js"></script>
</body>
</html>
