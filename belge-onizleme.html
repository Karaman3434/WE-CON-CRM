<!DOCTYPE html>
<!--
  WEICON ASİST — BELGE ÖNİZLEME v2
  ====================================
  WEICON logosu tek başına üstte, CARİ BİLGİ şeridi (isim, vade/fatura/
  kargo, fatura adresi, teslimat adresi, yetkili bilgisi), tablo başlığında
  Tür·Kod·Tarih bir arada, ürün tablosu (SIRA|ÜRÜN|ADET|LİSTE|İSK|NET|
  TOPLAM|PRİM), GENEL TOPLAM ve MÜDÜR PRİMİ şeritleri.
  Raporlar → Son İşlemler'den bir kayda "📄 Belgeyi Görüntüle" ile gelinir.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Belge Önizleme</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="belge-style.css">
<link rel="stylesheet" href="reports-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <button class="nav-btn nav-btn--geri" id="btnGeriAkilli"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></button>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>

<main class="sayfa">
  <div id="belgeIcerik"></div>
  <div class="belge-gecmis-kutu" id="belgeGecmisiKutu" hidden></div>
  <div class="belge-buton-satir">
    <button class="belge-yazdir-buton" id="btnYazdir">🖨 Yazdır</button>
    <button class="belge-duzenle-buton" id="btnBelgeDuzenle">✏️ Düzenle</button>
    <button class="belge-revize-buton" id="btnRevizeEt" hidden>🔄 Revize Et</button>
    <button class="belge-sil-buton" id="btnBelgeSil">🗑️ Sil</button>
  </div>

  <div class="duzenle-overlay" id="duzenleOverlay" hidden>
    <div class="duzenle-kutu">
      <div class="duzenle-baslik">Kaydı Düzenle</div>
      <div id="duzenleUrunListesi"></div>
      <div class="duzenle-buton-satir">
        <button class="duzenle-kapat-btn" id="btnDuzenleVazgec">Kapat</button>
        <button class="duzenle-kaydet-btn" id="btnDuzenleKaydet">Kaydet</button>
      </div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js?v=WG.260901.0852.64"></script>
<script src="customer-data.js?v=WG.260901.0852.64"></script>
<script src="reports-data.js?v=WG.260901.0852.64"></script>
<script src="reports-safety-fix.js?v=WG.260901.0852.64"></script>
<script src="hata-log.js?v=WG.260901.0852.64"></script>
<script src="belge-render.js?v=WG.260901.0852.64"></script>
</body>
</html>
