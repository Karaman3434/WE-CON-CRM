<!DOCTYPE html>
<!--
  WEICON ASİST — ARAÇ KM TAKİP v3
  ==================================
  Eski uygulamanın GERÇEK mantığı: günde TEK kilometre girişi ("fotoğraflanan
  KM"). Bu tek değer, o günün başlangıcı VE bir önceki günün bitişi olarak
  kullanılır (km-data.js'teki gununKmGir() bkz.).
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Araç KM</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="km-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="home.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>

<main class="sayfa">

  <!-- EN ÜST: dünün özet satırı (başlangıç → bitiş = mesafe) -->
  <div class="km-dun-ozet" id="kmDunOzet">Dünkü kayıt henüz yok.</div>

  <section class="km-form-kutu">
    <div class="hesap-alan">
      <label>Bugünün Kilometresi — <span id="kmBugunTarih"></span></label>
      <input type="number" id="kmBugun" placeholder="örn. 113340">
    </div>

    <div class="hesap-alan-grid">
      <div class="hesap-alan">
        <label>Saat</label>
        <input type="text" id="kmSaat" placeholder="örn. 09:00">
      </div>
      <div class="hesap-alan">
        <label>Tarih</label>
        <input type="text" id="kmTarihGoster" readonly>
      </div>
    </div>

    <div class="hesap-alan-grid">
      <div class="hesap-alan">
        <label>Seyir Güzergahı</label>
        <input type="text" id="kmGuzergah" placeholder="örn. Ankara - Kazan">
      </div>
      <div class="hesap-alan">
        <label>Ziyaret Edilen Yerler</label>
        <input type="text" id="kmZiyaretYerleri" placeholder="örn. Atlas Dry">
      </div>
    </div>

    <div class="kategori-secim">
      <button class="kategori-btn kategori-btn--secili" data-kategori="is">İş</button>
      <button class="kategori-btn" data-kategori="ozel">Özel</button>
    </div>

    <button class="km-kaydet-buton" id="btnKmKaydet">✓ Günü Kaydet</button>
  </section>

  <button class="km-tablo-goster-buton" id="btnTabloGoster">📋 Bu Ayın Kayıtlarını Tablo Olarak Göster</button>

  <section class="km-tablo-bolum" id="kmTabloBolum" hidden>
    <div class="km-tablo-baslik-satir">
      <div class="km-tablo-baslik" id="kmTabloBaslik">Bu Ayın Kayıtları</div>
      <div class="km-tablo-baslik-butonlar">
        <button class="km-tablo-kaydet-buton" id="btnKmTabloKaydet">✓ Kaydet</button>
        <button class="excel-buton" id="btnExcel">📊 Excel'e Aktar</button>
      </div>
    </div>
    <select class="km-ay-secici" id="kmAySecici"></select>
    <div class="data-table-container">
      <table class="data-table km-veri-tablo">
        <thead><tr>
          <th>Tarih</th><th>Saat</th><th>Güzergah</th><th>Ziyaret</th><th>Başlangıç KM</th><th>Bitiş KM</th><th>İş KM</th><th>Özel KM</th>
        </tr></thead>
        <tbody id="kmTabloGovde"></tbody>
      </table>
    </div>
    <div class="km-ay-toplam">
      <span>Aylık Toplam (İş)</span>
      <strong id="kmAyToplamIs">0 km</strong>
    </div>
    <div class="km-ay-toplam km-ay-toplam--ozel">
      <span>Aylık Toplam (Özel)</span>
      <strong id="kmAyToplamOzel">0 km</strong>
    </div>
  </section>

</main>

<!-- İLK KULLANIM: hiç KM kaydı yoksa başlangıç değeri iste -->
<div class="km-baslangic-overlay" id="kmBaslangicOverlay" hidden>
  <div class="km-baslangic-kutu">
    <div class="km-baslangic-baslik">🚗 Başlangıç Kilometresi Gerekli</div>
    <p class="km-baslangic-aciklama" id="kmBaslangicAciklama"></p>
    <input type="number" id="kmBaslangicInput" placeholder="örn. 42150" inputmode="decimal">
    <button class="km-baslangic-kaydet-btn" id="btnKmBaslangicKaydet">Kaydet ve Başla</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js?v=WG.010926.2054.78"></script>
<script src="km-data.js?v=WG.010926.2054.78"></script>
<script src="hata-log.js?v=WG.010926.2054.78"></script>
<script src="km-render.js?v=WG.010926.2054.78"></script>
</body>
</html>
