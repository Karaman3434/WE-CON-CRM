  açılıyordu). Üstte YILLIK TOPLAM ve AYLIK TOPLAM panoları (İş/Özel
  ayrımıyla), altında ay seçici + gerçek/düzenlenebilir tablo + Kaydet +
  Excel'e Aktar — hepsi eskisiyle aynı mantık, sadece kendi sayfasında.

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — KM Kayıtları</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.240926.2123.622">
<link rel="stylesheet" href="km-style.css?v=WG.250926.1850.627">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="km.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>
</div>
<div class="rota-etiketi">Araç KM › <b>Kayıtlar</b></div>

<main class="sayfa kmk-sayfa">

  <div class="km-toplam-grup-baslik">YILLIK TOPLAM · <span id="kmYilEtiket">2026</span></div>
  <section class="km-toplam-satir">
    <div class="km-toplam-kutu km-toplam-kutu--is-dolu">
      <div class="km-toplam-kutu-etiket">İŞ KM</div>
      <div class="km-toplam-kutu-deger" id="kmYilToplamIs">0 km</div>
    </div>
    <div class="km-toplam-kutu km-toplam-kutu--ozel-dolu">
      <div class="km-toplam-kutu-etiket">ÖZEL KM</div>
      <div class="km-toplam-kutu-deger" id="kmYilToplamOzel">0 km</div>
    </div>
  </section>

  <div class="km-toplam-grup-baslik">AYLIK TOPLAM · <span id="kmAyEtiket">bu ay</span></div>
  <section class="km-toplam-satir">
    <div class="km-toplam-kutu km-toplam-kutu--is">
      <div class="km-toplam-kutu-etiket">İŞ KM</div>
      <div class="km-toplam-kutu-deger" id="kmAyToplamIs">0 km</div>
    </div>
    <div class="km-toplam-kutu km-toplam-kutu--ozel">
      <div class="km-toplam-kutu-etiket">ÖZEL KM</div>
      <div class="km-toplam-kutu-deger" id="kmAyToplamOzel">0 km</div>
    </div>
  </section>

  <select class="km-ay-secici" id="kmAySecici"></select>

  <div class="km-tablo-baslik-satir">
    <div class="km-tablo-baslik" id="kmTabloBaslik">Bu Ayın Kayıtları</div>
    <div class="km-tablo-baslik-butonlar">
      <button class="km-tablo-kaydet-buton" id="btnKmTabloKaydet">✓ Kaydet</button>
      <button class="excel-buton" id="btnExcel">📊 Excel'e Aktar</button>
    </div>
  </div>
  <div class="data-table-container">
    <table class="data-table km-veri-tablo">
      <thead><tr>
        <th>Tarih</th><th>Saat</th><th>Güzergah</th><th>Ziyaret</th><th>Başlangıç KM</th><th>Bitiş KM</th><th>İş KM</th><th>Özel KM</th>
      </tr></thead>
      <tbody id="kmTabloGovde"></tbody>
    </table>
  </div>

</main>

<!-- xlsx-js-style (25.09.2026): standart "xlsx" kütüphanesinin ÜCRETSİZ
