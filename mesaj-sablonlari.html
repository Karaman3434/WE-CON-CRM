<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="menu.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>

</nav>

<div class="rota-etiketi">Menü › <b>Mesaj Ayarları</b></div>

<main class="sayfa">
  <div class="sayfa-baslik">✉️ Mesaj Ayarları</div>

  <section class="ayar-kutu">
    <label>📧 E-posta metni</label>
    <textarea id="sablonMailMetni" rows="9" placeholder="Mail metnini buraya yaz"></textarea>
    <button class="kaydet-buton" id="btnMailKaydet">Kaydet</button>
    <div id="mailDurum" style="font-size:12px;font-weight:700;margin-top:6px;min-height:16px;"></div>
  </section>

  <section class="ayar-kutu">
    <label>📱 WhatsApp metni</label>
    <textarea id="sablonWhatsappMetni" rows="9" placeholder="WhatsApp metnini buraya yaz"></textarea>
    <button class="kaydet-buton" id="btnWhatsappKaydet">Kaydet</button>
    <div id="whatsappDurum" style="font-size:12px;font-weight:700;margin-top:6px;min-height:16px;"></div>
  </section>

  <div style="font-size:11px;color:#8a96a3;font-weight:600;padding:0 2px;">Yazdığın metin, Gönder ekranında ve gönderimde olduğu gibi çıkar.</div>
</main>
