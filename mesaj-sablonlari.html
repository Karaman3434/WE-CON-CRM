<main class="sayfa">
  <div class="sayfa-baslik">✉️ Mesaj Şablonları</div>

  <section class="ayar-kutu">
    <label>E-posta Şablonu ({URUN}, {BELGE}, {FIRMA} yer tutucuları kullanılabilir)</label>
    <textarea id="sablonMailMetni" rows="4" placeholder="Örn: {FIRMA} için hazırladığımız {BELGE}'i ekte bulabilirsiniz."></textarea>
  </section>

  <section class="ayar-kutu">
    <label>📱 WhatsApp Şablonu</label>
    <textarea id="sablonWhatsappMetni" rows="4" placeholder="Örn: İstediğiniz {URUN} için fiyat bilgisini paylaştım."></textarea>
  </section>

  <button class="kaydet-buton" id="btnSablonKaydet">Şablonları Kaydet</button>
</main>
