<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="menu.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>

<main class="sayfa">
  <div class="sayfa-baslik">⚙️ Ayarlar</div>

  <section class="ayar-kutu">
    <label>Güncel Kur (EUR → TL)</label>
    <input type="number" id="kurInput" step="0.0001">
    <p class="kur-son-guncelleme" id="kurSonGuncelleme">Son otomatik güncelleme: —</p>
    <button class="kur-simdi-dene-btn" id="btnKurSimdiDene">🔄 Şimdi Dene (Otomatik Çek)</button>
    <a class="tcmb-link" href="https://www.tcmb.gov.tr/kurlar/kurlar_tr.html" target="_blank" rel="noopener">
      🏦 TCMB Günlük Döviz Kurları — güncel kuru öğrenmek için dokun
    </a>
  </section>

  <section class="ayar-kutu">
    <label>KDV Oranı (%)</label>
    <input type="number" id="kdvInput" step="1">
  </section>

  <button class="kaydet-buton" id="btnAyarKaydet">Ayarları Kaydet</button>

  <p class="surum-bilgisi" id="surumBilgisi"></p>
</main>
