<!DOCTYPE html>
<!--
  WEICON ASİST — MÜŞTERİ LİSTESİ v3
  ====================================
  SADECE liste — arama + sıralama + müşteri satırları. Yeni müşteri ekleme
  ARTIK ayrı bir sayfa (customer-add.html). Bir müşteriye dokununca SADECE
  o müşterinin kartı açılır (customer-detail.html), başka hiçbir şey.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Müşteriler</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="customer-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="hareketler.html">Geri</a>
  <a class="nav-btn nav-btn--ana" href="home.html">Ana Sayfa</a>
  <button class="nav-btn nav-btn--menu" id="btnMenu">Menü</button>
</nav>

<main class="sayfa">

  <div class="arama-kutusu">
    <input type="text" id="musteriAra" placeholder="Müşteri adı veya şehir ara..." autocomplete="off">
    <span class="arama-ikon">🔍</span>
  </div>

  <div class="siralama-satiri">
    <label>Sırala:</label>
    <select id="musteriSiralama">
      <option value="alfabetik">Alfabetik</option>
      <option value="sehir">Şehre Göre</option>
      <option value="sonZiyaret">Son Ziyarete Göre</option>
    </select>
  </div>

  <a class="yeni-musteri-buton" href="customer-add.html">+ Yeni Müşteri Ekle</a>

  <div id="musteriListesi"></div>
  <p class="bos-mesaj" id="musteriBosMesaj" hidden>Müşteri bulunamadı.</p>
  <p class="yukleniyor-mesaj" id="musteriYukleniyor">Müşteri listesi yükleniyor...</p>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="customer-data.js"></script>
<script src="customer-render.js"></script>
</body>
</html>
