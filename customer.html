<!DOCTYPE html>
<!--
  WEICON ASİST — MÜŞTERİ LİSTESİ v3
  ====================================
  SADECE liste — arama + sıralama + müşteri satırları. Yeni müşteri ekleme
  ARTIK ayrı bir sayfa (customer-add.html). Bir müşteriye dokununca SADECE
  o müşterinin kartı açılır (customer-detail.html), başka hiçbir şey.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3d8c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEICON ASİST">
<title>WEICON ASİST — Müşteriler</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.260926.2033.638">
<link rel="stylesheet" href="customer-style.css?v=WG.140926.1213.555">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="home.html"><span class='nav-ikon nav-ikon--geri-kucuk'>‹</span><span class='nav-ikon nav-ikon--geri-buyuk'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>
</div>
<div class="sayfa-rota-serit" id="rotaSeridi"></div>

<main class="sayfa">

  <div class="arama-kutusu">
    <input type="text" id="musteriAra" placeholder="Müşteri adı veya şehir ara..." autocomplete="off">
    <span class="arama-ikon">🔍</span>
  </div>

  <div class="musteri-filtre-satiri">
    <input type="text" id="musteriSehirFiltre" placeholder="Şehir yazarak filtrele...">
    <a class="musteri-yeni-ekle-btn" href="customer-add.html">➕ Yeni Müşteri Ekle</a>
  </div>

  <p class="liste-bilgi-notu" id="listeBilgiNotu" hidden></p>

  <div id="musteriListesi"></div>
  <p class="bos-mesaj" id="musteriBosMesaj" hidden>Müşteri bulunamadı.</p>
  <p class="yukleniyor-mesaj" id="musteriYukleniyor">Müşteri listesi yükleniyor...</p>
  <button class="tum-musteriler-buton" id="btnTumMusteriler" hidden>👥 Tüm Müşterileri Göster</button>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="auth.js?v=WG.220926.2331.604"></script>

<script src="customer-data.js?v=WG.240926.0752.611"></script>
<script src="reports-data.js?v=WG.150926.1224.571"></script>
<script src="hata-log.js?v=WG.130926.2010.553"></script>
<script src="rota-takip.js?v=WG.150926.1300.573"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ RotaTakip.kaydet("customer.html", "🔍 Müşteri Bul"); RotaTakip.ciz("rotaSeridi"); });</script>
<script src="customer-render.js?v=WG.220926.2158.601"></script>
</body>
</html>
