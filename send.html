<!DOCTYPE html>
<!--
  WEICON ASİST — GÖNDER v3
  ===========================
  Sepet'ten (tüm ürünler hesaplandıktan sonra) gelinir. Müşteri ve belge
  türü artık BURADA seçilmiyor — İşlem Yap akışında baştan seçilmiş olarak
  gelir. Sadece: müşteri kartı + hareket tablosu (belge-tablosu tasarımı)
  + Kaydet/Gönder. Kaydedilince "Formu Görüntüle" ile tam önizleme
  (vade/fatura/kargo/adres/yetkili + tablo + mesaj metni) açılabilir; bir
  hata görülürse "Geri" ile Sepet'e dönülüp düzeltme yapılabilir — aynı
  gün + aynı müşteri + aynı ürün seti olduğu için tekrar Kaydet'e
  basıldığında yeni kayıt AÇILMAZ, mevcut kayıt revize edilir.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Gönder</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css">
<link rel="stylesheet" href="cart-style.css">
<link rel="stylesheet" href="send-style.css">
<link rel="stylesheet" href="belge-style.css">
<link rel="stylesheet" href="detail-style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="cart.html">Geri</a>
  <a class="nav-btn nav-btn--ana" href="home.html">Ana Sayfa</a>
  <button class="nav-btn nav-btn--menu" id="btnMenu">Menü</button>
</nav>

<main class="sayfa">

  <section class="musteri-ozet-kutu">
    <div class="musteri-ozet-ad" id="ozetMusteriAd">—</div>
    <div class="musteri-ozet-sehir" id="ozetMusteriSehir"></div>
    <div class="musteri-ozet-tip" id="ozetTipRozet"></div>
  </section>

  <div id="hareketTabloAlani"></div>

  <div class="sepet-alt-buton-satir" id="onKaydetButonSatiri">
    <button class="sepet-kaydet-btn" id="btnKaydet">✓ Kaydet</button>
    <button class="sepet-gonder-btn" id="btnGonder">📤 Gönder</button>
  </div>

  <section class="gonder-kutu" id="gonderKutu" hidden>
    <div class="gonder-baslik" id="gonderBaslikYazi">✓ Kaydedildi — İstersen müşteriye gönder</div>

    <button class="formu-goruntule-btn" id="btnFormuGoruntule">👁 Formu Görüntüle</button>
    <div id="tamOnizlemeAlani" hidden></div>
    <button class="geri-duzelt-btn" id="btnGeriDuzelt" hidden>‹ Geri — Sepete Dön ve Düzelt</button>

    <select class="gonder-kisi-secim" id="gonderKisiSecim" hidden></select>
    <textarea id="gonderMetin" rows="6"></textarea>
    <div class="gonder-alan-grid">
      <input type="tel" id="gonderTelefon" placeholder="Telefon (WhatsApp için)">
      <input type="email" id="gonderEposta" placeholder="E-posta">
    </div>
    <div class="gonder-tile-satir">
      <button class="gonder-tile gonder-tile--mail" id="btnEposta">
        <span class="gonder-tile-ikon">📧</span>
        <span class="gonder-tile-baslik">MAIL GÖNDER</span>
      </button>
      <button class="gonder-tile gonder-tile--whatsapp" id="btnWhatsapp">
        <span class="gonder-tile-ikon">💬</span>
        <span class="gonder-tile-baslik">WHATSAPP GÖNDER</span>
      </button>
    </div>
    <div class="sablon-link-satir">
      <button class="sablon-link-btn" id="btnWhatsappSablon">📱 şablonu uygula</button>
      <button class="sablon-link-btn" id="btnEpostaSablon">✉️ şablonu uygula</button>
    </div>
    <button class="gonder-bitir-buton" id="btnGonderBitir">Ana Sayfa'ya Dön</button>
  </section>

  <!-- Mail Önizleme — MAIL GÖNDER'e basınca, gerçek mail açılmadan önce
       konu başlığı + mesaj + sipariş tablosu birlikte gösterilir. -->
  <div class="overlay" id="mailOnizlemeOverlay" hidden>
    <div class="sheet mail-onizleme-sheet">
      <div class="sheet-baslik">📧 Mail Önizleme</div>
      <div class="sheet-alt">Göndermeden önce son kontrol — konuyu değiştirebilirsin.</div>

      <div class="form-etiket">KONU</div>
      <input type="text" class="form-input" id="mailOnizlemeKonu">

      <div class="form-etiket">ALICI</div>
      <input type="email" class="form-input" id="mailOnizlemeAlici" readonly>

      <div class="form-etiket">MESAJ</div>
      <div class="mail-onizleme-metin" id="mailOnizlemeMetin"></div>

      <div class="form-etiket">SİPARİŞ TABLOSU (ekte / görsel olarak gidecek)</div>
      <div id="mailOnizlemeTablo"></div>

      <div class="sheet-buton-satir">
        <button class="btn-vazgec" id="mailOnizlemeVazgecBtn">Vazgeç</button>
        <button class="btn-kaydet" id="mailOnizlemeGonderBtn">📧 Şimdi Gönder</button>
      </div>
    </div>
  </div>


  <!-- Görsel oluşturma için ekran dışına gizlenmiş belge alanı — html2canvas
       bunu PNG'ye çevirip WhatsApp/Mail ile paylaşacak. Kullanıcı bunu
       görmez, sadece render için var. -->
  <div id="belgeGorselAlani" style="position:fixed; left:-9999px; top:0; width:380px;"></div>

  <!-- Revize/İlerletme aşama seçimi: Numune→Proforma/Teklif veya
       Teklif→Proforma/Sipariş gibi birden çok seçenek varken Gönder/Kaydet
       anında açılır. -->
  <div class="tip-secim-overlay" id="asamaSecimOverlay" hidden>
    <div class="tip-secim-kutu">
      <div class="tip-secim-baslik">Bu kayıt hangi aşamaya dönüşsün?</div>
      <div class="tip-secim" id="asamaSecimButonlari"></div>
      <button class="tip-secim-vazgec-btn" id="btnAsamaSecimVazgec">Vazgeç</button>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="ayarlar-sync.js"></script>
<script src="hareket-tablo.js"></script>
<script src="cart-data.js"></script>
<script src="customer-data.js"></script>
<script src="send-data.js"></script>
<script src="send-render.js"></script>
</body>
</html>
