<main class="sayfa">
  <p class="veri-uyari" style="background:#eaf2fc;border-color:#003a70;color:#003a70;">

    işlem geçmişine, ayarlara dokunmaz. WEICON'dan gelen fiyat listesi PDF'ini Claude'a
    verip JSON'a çevirtir, o JSON'u burada yüklersin.
  </p>

  <button class="veri-buton veri-buton--gri" id="btnDosyaSec" style="width:100%;">📄 JSON Dosyası Seç</button>

  </div>
