<!DOCTYPE html>
<!--
  WEICON ASİST — ÜRÜN BUL v2
  ===========================
  home.html ile aynı desen: shell / style / data / render ayrımı, ağır CSS
  efekti yok (gradyan/gölge yığılması yasak — bkz. product-style.css üst yorum).

  Ürün kataloğu Firebase'in KÖK ("/") yolundan, eski uygulamayla AYNI
  yöntemle çekiliyor — böylece iki sürüm aynı veriyi paylaşır, ayrı bir
  veri taşıma işine gerek kalmaz.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Ürün Bul</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.060926.1243.151">
<link rel="stylesheet" href="product-style.css?v=WG.050926.1522.136">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="home.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>
</div>
<div class="rota-etiketi">Satış › <b>Ürün Bul</b></div>

<main class="sayfa">

  <div class="arama-kutusu">
    <input type="text" id="searchInput" placeholder="Ürün adı, Berta veya Abas kodu ara..." autocomplete="off">
    <span class="arama-ikon">🔍</span>
  </div>

  <div class="ozel-liste-satiri">
    <button class="ozel-liste-btn ozel-liste-btn--kirmizi" id="btnHitUrunler">🔥 Hit Ürünler</button>
    <button class="yeni-urun-ac-buton yeni-urun-ac-buton--yanyana" id="btnYeniUrunAc">➕ Yeni Ürün Ekle</button>
  </div>

  <div class="yeni-urun-overlay" id="yeniUrunOverlay" hidden>
    <section class="yeni-urun-form">
      <div class="yeni-urun-form-baslik">Yeni Ürün Ekle</div>
      <div class="form-satir-2">
        <input type="text" id="yeniUrunBerta" placeholder="Berta Kodu">
        <input type="text" id="yeniUrunAbas" placeholder="Abas Kodu">
      </div>
      <input type="text" id="yeniUrunAdi" placeholder="Ürün Adı *">
      <input type="number" step="0.01" id="yeniUrunFiyat" placeholder="Liste Fiyatı (EUR) *">
      <p class="yeni-urun-hata" id="yeniUrunHata" hidden></p>
      <div class="form-buton-satir">
        <button class="birlestir-vazgec-btn" id="btnYeniUrunVazgec">Kapat</button>
        <button class="yeni-urun-kaydet-btn" id="btnYeniUrunKaydet">✓ Kaydet</button>
      </div>
    </section>
  </div>

  <button class="sepet-goster-buton" id="btnSepeteDevam" hidden>🛒 Sepet (<span id="sepetSayisi">0</span>)</button>

  <div class="data-table-container" id="anaTabloAlani">
    <table class="data-table">
      <thead><tr>
        <th class="col-urun">ÜRÜN</th>
        <th class="col-euro">EURO</th>
        <th class="col-islem">İŞLEM</th>
      </tr></thead>
      <tbody id="sonucListesi"></tbody>
    </table>
  </div>

  <p class="bos-mesaj" id="bosMesaj" hidden>Sonuç bulunamadı.</p>
  <p class="yukleniyor-mesaj" id="yukleniyorMesaj">Katalog yükleniyor...</p>

  <!-- HİT ÜRÜNLER / EN ÇOK ARANAN — açılır bölüm -->
  <section class="acilir-liste-bolum" id="ozelListeBolumu" hidden>
    <div class="acilir-liste-baslik-satir">
      <span id="ozelListeBaslik"></span>
      <button class="acilir-liste-kapat" id="btnOzelListeKapat">✕</button>
    </div>
    <p class="acilir-liste-ipucu">💡 Bir ürüne dokunarak doğrudan sepete ekleyebilirsiniz.</p>
    <div class="data-table-container">
      <table class="data-table hit-urun-tablo">
        <thead><tr><th>Ürün</th><th>Toplam Adet</th><th>Geçmiş</th></tr></thead>
        <tbody id="ozelListeGovde"></tbody>
      </table>
    </div>
  </section>

  <!-- ÜRÜN SATIŞ GEÇMİŞİ — açılır bölüm -->
  <section class="urun-gecmis-bolum" id="urunGecmisBolumu" hidden>
    <div class="urun-gecmis-ust-serit">
      <div class="urun-gecmis-kod" id="urunGecmisKod"></div>
      <div class="urun-gecmis-ad" id="urunGecmisAd"></div>
    </div>
    <div class="urun-gecmis-ozet-grid">
      <div class="urun-gecmis-ozet-kutu">
        <div class="urun-gecmis-ozet-sayi" id="urunGecmisMusteriSayisi">0</div>
        <div class="urun-gecmis-ozet-etiket">FARKLI MÜŞTERİ</div>
      </div>
      <div class="urun-gecmis-ozet-kutu">
        <div class="urun-gecmis-ozet-sayi urun-gecmis-ozet-sayi--yesil" id="urunGecmisToplamAdet">0 adet</div>
        <div class="urun-gecmis-ozet-etiket">TOPLAM SATILAN</div>
      </div>
    </div>
    <button class="urun-gecmis-kapat-btn" id="btnUrunGecmisKapat">✕ Kapat</button>
    <div id="urunGecmisListesi"></div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js?v=WG.030926.1547.104"></script>
<script src="ust-sabit-olcum.js?v=WG.050926.2126.139"></script>
<script src="customer-data.js?v=WG.060926.0001.142"></script>
<script src="reports-data.js?v=WG.050926.2215.141"></script>
<script src="reports-safety-fix.js?v=WG.020926.1338.87"></script>
<script src="product-data.js?v=WG.060926.1902.152"></script>
<script src="hata-log.js?v=WG.020926.1338.87"></script>
<script src="product-render.js?v=WG.020926.1338.87"></script>
<script src="yarim-kalan-uyari.js?v=WG.040926.1500.115"></script>
</body>
</html>
