<!DOCTYPE html>
<!--
  WEICON ASİST — ZİYARET / TEMAS TAKVİMİ v2
  =============================================
  Aylık takvim: Pazartesi başlangıç, Cmt/Paz kırmızı. Güne dokununca o günün
  ziyaret/temas kayıtları + yeni kayıt ekleme formu (firma seç, ziyaret/temas,
  not, opsiyonel hatırlatma tarihi) açılır. Gün üzerinde kaç kayıt varsa rozet
  gösterir.
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEICON ASİST — Ziyaret Takvimi</title>
<script>document.documentElement.style.visibility='hidden';</script>
<link rel="stylesheet" href="home-style.css?v=WG.250926.2245.631">
<link rel="stylesheet" href="ziyaret-style.css?v=WG.250926.2245.631">
</head>
<body>

<div class="app-ust-sabit">
<header class="app-header">
  <div class="logo">WEICON</div>
  <div class="tarih" id="gunTarihi"></div>
</header>

<nav class="app-nav">
  <a class="nav-btn nav-btn--geri" href="raporlar.html"><span class='nav-ikon'>‹</span><span class='nav-etiket'>Geri</span></a>
  <a class="nav-btn nav-btn--ana" href="home.html"><span class='nav-ikon'>🏠</span><span class='nav-etiket'>Ana Sayfa</span></a>
  <button class="nav-btn nav-btn--menu" id="btnMenu"><span class='nav-ikon'>☰</span><span class='nav-etiket'>Menü</span></button>
</nav>
</div>
<div class="sayfa-rozeti-serit"><span class="sayfa-rozeti-ikon">📅</span><span class="sayfa-rozeti-ad">ZİYARET TAKVİMİ</span></div>

<main class="sayfa">

  <a class="ziy-takip-btn" href="takip-gerekenler.html">📋 Takip Gerekenler</a>

  <!-- Gün Filtrele + Ay seç — tek satır, yarı yarıya (25.09.2026, eskiden
       Gün Filtrele kendi satırında + altında ◀ Eylül 2026 ▶ ok gezinmesi
       ayrı iki satırdı). Ay okları kaldırıldı, "Eylül 2026" artık dokununca
       yatay kaydırılabilir ay listesi açan bir tuş. -->
  <div class="ziy-filtre-satir">
    <div class="ziy-gun-filtre-yari">
      <span class="ziy-filtre-ikon">📅</span>
      <input type="date" id="ziyGunFiltre" class="ziy-gun-filtre-input">
    </div>
    <button type="button" class="ziy-ay-sec-btn" id="btnAySecAc">
      <span class="ziy-filtre-ikon">🗓️</span><span id="ziyAyBaslik"></span>
    </button>
  </div>

  <div class="ziy-takvim-kutu">
    <div class="ziy-gun-basliklari">
      <span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span>
      <span class="ziy-tatil-baslik">Cmt</span><span class="ziy-tatil-baslik">Paz</span>
    </div>
    <div class="ziy-takvim-grid" id="ziyTakvimGrid"></div>
  </div>

  <section class="ziy-gun-panel" id="ziyGunPanel" hidden>
    <!-- İşlemler + seçili gün etiketi tek satırda (25.09.2026, eskiden
         seçili gün başlığı ayrı bir satırdı). -->
    <div class="ziy-ust-bilgi-satir">
      <span class="ziy-islem-baslik" id="ziyIslemBaslik" hidden>📋 İşlemler</span>
      <span class="ziy-gun-panel-baslik" id="ziyGunPanelBaslik"></span>
    </div>

    <!-- Günün işlemleri (15.09.2026) — takvimin/başlığın hemen altında,
         görev girme (temas/yeni kayıt ekle) bölümünden ÖNCE gösterilir. -->
    <div id="ziyIslemTablosu"></div>

    <div id="ziyGunKayitListesi"></div>
    <p class="bos-mesaj" id="ziyGunKayitBos" hidden>Bu günde kayıt yok.</p>

    <div class="ziy-yeni-kayit-baslik">+ Yeni kayıt ekle</div>
    <div class="ziy-arama-temas-satir">
      <div class="arama-kutusu">
        <input type="text" id="ziyFirmaAra" placeholder="Firma ara..." autocomplete="off">
        <span class="arama-ikon">🔍</span>
      </div>
      <button type="button" class="ziy-temas-ac-btn" id="btnZiyTemasAc">Temas</button>
    </div>
    <div id="ziyFirmaSonuclari"></div>
    <div class="ziy-secili-firma" id="ziySeciliFirma" hidden></div>

    <input type="text" id="ziyNot" placeholder="Not (opsiyonel)">

    <label class="ziy-hatirlatma-satir">
      <input type="checkbox" id="ziyHatirlatmaCheck">
      <span>🔔 Hatırlatma ekle</span>
    </label>
    <input type="date" id="ziyHatirlatmaTarih" hidden>
    <p class="ziy-hatirlatma-not">Bu tarihin sabahı, uygulamayı açtığında hatırlatma bildirimi gösterilir.</p>

    <div class="ziy-alt-buton-satir">
      <button class="ziy-panel-kapat-btn" id="btnZiyGunKapat">Kapat</button>
      <button class="ziy-kaydet-btn" id="btnZiyKaydet">✓ Kaydet</button>
    </div>
  </section>

</main>

<!-- Ay Seç pop-up (25.09.2026) — ◀ Eylül 2026 ▶ ok gezinmesinin yerini
     aldı. Aylar tek satırda yan yana, yatay kaydırılabilir; açılışta
     seçili aya otomatik kaydırılır (bkz. ziyaret-render.js aySecPopupAc). -->
<div class="ziy-hatirlatma-overlay" id="ziyAySecOverlay" hidden>
  <div class="ziy-hatirlatma-kutu">
    <div class="ziy-hatirlatma-baslik" style="text-align:center;">Ay seç</div>
    <div class="ziy-ay-sec-satir" id="ziyAySecSatir"></div>
    <button class="ziy-hatirlatma-kapat-btn" id="btnZiyAySecKapat">Kapat</button>
  </div>
</div>

<!-- Temas pop-up (25.09.2026) — eskiden her zaman görünen 2x2 tuş grubu
     artık burada, arama kutusunun yanındaki "Temas" tuşuna basınca açılır.
     Kutu içinde kutu OLMASIN diye .ziy-hatirlatma-overlay/-kutu ile AYNI
     düz (tek panel) desen kullanıldı. -->
<div class="ziy-hatirlatma-overlay" id="ziyTemasOverlay" hidden>
  <div class="ziy-hatirlatma-kutu">
    <div class="ziy-hatirlatma-baslik" style="text-align:center;">Temas türü seç</div>
    <div class="ziy-tur-secim">
      <button class="ziy-tur-btn ziy-tur-btn--ziyaret" id="btnTurZiyaret" data-tur="ziyaret">📍 Ziyaret</button>
      <button class="ziy-tur-btn ziy-tur-btn--telefon" id="btnTurTelefon" data-tur="telefon">📞 Telefon</button>
      <button class="ziy-tur-btn ziy-tur-btn--mail" id="btnTurMail" data-tur="mail">✉️ Mail</button>
      <button class="ziy-tur-btn ziy-tur-btn--whatsapp" id="btnTurWhatsapp" data-tur="whatsapp">💬 WhatsApp</button>
    </div>
    <button class="ziy-hatirlatma-kapat-btn" id="btnZiyTemasKapat">Kapat</button>
  </div>
</div>

<div class="ziy-hatirlatma-overlay" id="ziyHatirlatmaOverlay" hidden>
  <div class="ziy-hatirlatma-kutu">
    <div class="ziy-hatirlatma-baslik">🔔 Bugünkü Hatırlatmalar</div>
    <div id="ziyHatirlatmaListesi"></div>
    <button class="ziy-hatirlatma-kapat-btn" id="btnZiyHatirlatmaKapat">Tamam</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=WG.130926.2010.553"></script>
<script src="auth.js?v=WG.220926.2331.604"></script>
<script src="ust-sabit-olcum.js?v=WG.060926.2105.156"></script>
<script src="customer-data.js?v=WG.240926.0752.611"></script>
<script src="reports-data.js?v=WG.150926.1224.571"></script>
<script src="hata-log.js?v=WG.130926.2010.553"></script>
<script src="ziyaret-render.js?v=WG.250926.2245.631"></script>
</body>
</html>
